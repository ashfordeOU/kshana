# The lunar-station-coverage run whose arithmetic the independent numpy re-computation
# checks (scripts/gen_lunar_station_ref.py; tests/fixtures/lunar_station/PREREGISTRATION.md).
# Every error term is switched on (survey, receiver noise, ageing, quantization), so every
# step of the arithmetic is exercised; five listed points and few epochs and trials keep
# the exported samples small. Not a statement about any real system.
kind = "lunar-station-coverage"
points = [
  { lat_deg = -89.0, lon_deg = 0.0 },
  { lat_deg = -88.0, lon_deg = 90.0 },
  { lat_deg = -86.0, lon_deg = 180.0 },
  { lat_deg = -84.0, lon_deg = 270.0 },
  { lat_deg = -90.0, lon_deg = 0.0 },
]
survey_sigma_m = 0.30
noise_m = 0.30
latency_s = 10.0
quantization_bits = 8
t_span_s = 21600.0
t_step_s = 3600.0
n_trials = 8
seed = 2026
