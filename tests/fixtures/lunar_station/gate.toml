# A small lunar-station-coverage run for the debug-build gates (tests/field_units_global.rs):
# the bundled scenario's inputs on a coarser grid, fewer epochs and fewer trials, so it
# emits the same document shape in well under a second. Explicit points are listed so the
# echoed points[] columns are reached too.
kind = "lunar-station-coverage"
points = [
  { lat_deg = -89.0, lon_deg = 0.0 },
  { lat_deg = -88.0, lon_deg = 90.0 },
  { lat_deg = -86.0, lon_deg = 180.0 },
  { lat_deg = -84.0, lon_deg = 270.0 },
  { lat_deg = -90.0, lon_deg = 0.0 },
]
t_span_s = 21600.0
t_step_s = 3600.0
n_trials = 8
