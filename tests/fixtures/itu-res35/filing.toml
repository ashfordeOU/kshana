# A fictional non-GSO system for the itu-res35 tests and docs/ITU-RES35.md. Not a real filing.
system = "EXAMPLE-NGSO"
administration = "XX (fictional)"
# End of the seven-year regulatory period of No. 11.44 (resolves 7 applies: on or after 2021-01-01).
regulatory_period_end = "2022-06-15"

[select]
name_prefixes = ["EXNGSO-"]
object_id_prefixes = ["2025-001", "2025-002"]

# Assumptions, not from Resolution 35 (it gives no numeric tolerance).
