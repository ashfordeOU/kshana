# A clock scenario whose classical clock takes the noise of a measured log (`[clock_fit]`).
#
# The simulation below is clock-holdover.toml, unchanged, except that `[clock_fit]` replaces the
# classical clock's noise with the noise fitted from the measured log: white FM, flicker FM and
# random-walk FM, and the linear drift, by the device-card fit of src/clock_library/card.rs; the initial
# frequency offset y0 stays as written. The result gains a `fitted` block (the coefficients, the fit
# points and what the run used) beside the `measured` block. White phase noise is fitted and reported but not
# simulated. The log here is the first 6 hours (720 readings at 30 s) of the clock of GPS satellite G01 from
# the IGS final combined clock of 2026-08-02, phase relative to its first reading, in ns, as a TimeLab-style
# two-column log (an extract of an IGS product: International GNSS Service, free for any use with
# attribution). Replace it with your own log by giving `path = "..."` and `format` instead of `text`.
# MODELLED: a what-if for that clock's noise as the log shows it; not a calibration of the clock and not a
# prediction of its future behaviour. See docs/CLOCK-LOG-FORMATS.md.
# Kshana reference scenario: 2 h run, 10 min GNSS sync then ~1.8 h denied.
# Clock white-FM noise calibrated to published sigma_y(1 s): q_wf = sigma_y(1s)^2.
# Validated against simulated Allan deviation in tests/calibration.rs (~2%).
seed = 42
threshold_ns = 20.0

[time]
step_s = 10.0
duration_s = 7200.0

[gnss]
windows = [
  { t0 = 0.0,    t1 = 600.0,  state = "nominal" },
  { t0 = 600.0,  t1 = 7200.0, state = "denied" },
]

[clock_quantum]
id = "optical-sr-lattice"
provenance = "Strontium optical lattice clock, space-oriented goal sigma_y(1s)=1e-15 (Origlia/Schiller/Bongs et al., arXiv:1503.08457); q_wf=sigma_y(1s)^2; ground-demonstrator maturity, not flown; flicker/aging not modeled"
y0   = 5.0e-17
q_wf = 1.0e-30
q_rw = 0.0

[clock_classical]
id = "csac-sa45s"
provenance = "Microchip SA65 / SA.45s CSAC datasheet sigma_y(1s)=3e-10; q_wf=sigma_y(1s)^2; flicker/aging not modeled"
y0   = 5.0e-10
q_wf = 9.0e-20
q_rw = 0.0

