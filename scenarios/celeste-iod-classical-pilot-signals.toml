[[shape_checks]]
signal = "celeste-iod-e5-1-pfa"
description = "Measured Celeste IOD E5 spectrum shown at the ESA NAVISP LEO-PNT workshop, 2026: a narrow central BPSK(1)-like peak on a broad BPSK(10)-like main lobe with nulls near +/-10 MHz, sidelobes near +/-15 MHz about 22 to 25 dB below the peak (IOD-1 peak near -133 dBW/Hz, sidelobes -155 to -158 dBW/Hz); uncalibrated, so shapes only."
central_peak_min_db = 6.0
central_peak_ref_offset_mhz = 2.0
nulls_mhz = [10.0]
null_tolerance_mhz = 1.0
null_depth_db = 6.0
sidelobe_window_mhz = [13.0, 17.0]
sidelobe_below_peak_db = [20.0, 27.0]
