# Lunar surface PNT and timing availability by site and season (Artemis-class south-polar sites).
#
# For each site and each season (an epoch and a window after it) the map reports: relay positioning
# (four or more relays of an ILLUSTRATIVE LCNS-class constellation in view and PDOP under a threshold,
# from the same functions as moonlight-service-volume), whether the Earth and the Sun are above the
# horizon (from the analytic Sun and Moon positions and lunar orientation, so libration is in), and
# timing availability (a relay or the Earth in view) with the longest stretch of neither, which is the
# holdover a surface clock has to ride out. This flat-mask example needs no data; the terrain variant
# (lunar-surface-pnt-map-terrain.toml) adds the ray-marched horizon of the LOLA south-polar DEM.
#
# HONESTY: MODELLED. The relay set is illustrative and Keplerian, with the Moon turning at the mean rate
# for the relays (no libration) as in moonlight-service-volume; the Earth and Sun use the analytic
# orientation, so the two frames differ by that omission. The relay positioning figure does not change
# with the season in this model; the Earth and Sun figures do. No agreement with any real service or site
# is claimed. Advisory software, not certified navigation equipment.
kind = "lunar-surface-pnt-map"

season_dates = ["2028-01-01", "2028-04-01", "2028-07-01", "2028-09-30"]   # 91.3 days apart, ILLUSTRATIVE
window_days = 27.3217     # one sidereal month
step_min = 30.0
n_sats = 8                # ILLUSTRATIVE
sma_km = 9737.4           # ILLUSTRATIVE (about 8000 km above the mean lunar radius)
eccentricity = 0.6        # ILLUSTRATIVE
inc_deg = 57.7            # ILLUSTRATIVE
argp_deg = 90.0           # ILLUSTRATIVE (apolune over the southern hemisphere)
mask_deg = 5.0
pdop_threshold = 6.0
earth_mask_deg = 0.0
sun_mask_deg = 0.0

[[sites]]
name = "south-polar 89.9"
lat_deg = -89.9
lon_deg = 0.0

[[sites]]
name = "south-polar 89.5"
lat_deg = -89.5
lon_deg = 0.0

[[sites]]
name = "south-polar 88.5"
lat_deg = -88.5
lon_deg = 0.0

[[sites]]
name = "south-polar 85.0"
lat_deg = -85.0
lon_deg = 0.0
