# A clock scenario with a measured log beside the simulated holdover (`[clock_log]`).
#
# The simulation below is clock-holdover.toml, unchanged. The `[clock_log]` table adds a `measured`
# block to the result: the log is read to a phase series and its overlapping ADEV, TDEV and MTIE are
# reported at octave averaging factors (docs/CLOCK-LOG-FORMATS.md). The log here is the first 48 minutes
# (96 readings at 30 s) of the clock of GPS satellite G01 from the IGS final combined clock of
# 2026-08-02, phase relative to its first reading, in ns, written as a TimeLab-style two-column log
# (an extract of an IGS product: International GNSS Service, free for any use with attribution). Replace
# it with your own log by giving `path = "..."` and the `format` (rinex-clk, timelab, ticc, ...) instead
# of `text`. It describes that log as given; it does not change the simulation and is not a calibration.
# Kshana reference scenario: 2 h run, 10 min GNSS sync then ~1.8 h denied.
# Clock white-FM noise calibrated to published sigma_y(1 s): q_wf = sigma_y(1s)^2.
# Validated against simulated Allan deviation in tests/calibration.rs (~2%).
seed = 42
threshold_ns = 20.0

[time]
step_s = 10.0
duration_s = 7200.0

[gnss]
windows = [
  { t0 = 0.0,    t1 = 600.0,  state = "nominal" },
  { t0 = 600.0,  t1 = 7200.0, state = "denied" },
]

[clock_quantum]
id = "optical-sr-lattice"
provenance = "Strontium optical lattice clock, space-oriented goal sigma_y(1s)=1e-15 (Origlia/Schiller/Bongs et al., arXiv:1503.08457); q_wf=sigma_y(1s)^2; ground-demonstrator maturity, not flown; flicker/aging not modeled"
y0   = 5.0e-17
q_wf = 1.0e-30
q_rw = 0.0

[clock_classical]
id = "csac-sa45s"
provenance = "Microchip SA65 / SA.45s CSAC datasheet sigma_y(1s)=3e-10; q_wf=sigma_y(1s)^2; flicker/aging not modeled"
y0   = 5.0e-10
q_wf = 9.0e-20
q_rw = 0.0

