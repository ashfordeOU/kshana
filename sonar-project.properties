# SonarQube Cloud (sonarcloud.io) project configuration for the public Kshana crate.
#
# CI-based analysis (see .github/workflows/sonarcloud.yml): the Rust analyzer runs
# Clippy itself and imports the LCOV coverage the CI already produces with
# cargo-tarpaulin (the same ~96%-line report gated at 85% in ci.yml). Automatic
# Analysis must be turned OFF in the SonarCloud project settings for this to apply.
#
# The keys below must match the organization + project SonarCloud assigns when the
# repo is imported. Defaults follow SonarCloud's GitHub-import convention
# (<org-login> lowercased, <org>_<repo>); adjust if SonarCloud shows different keys.
sonar.organization=ashfordeou
sonar.projectKey=ashfordeOU_kshana
sonar.projectName=kshana

# Analyse the engine's Rust source; tests are declared so they are measured as tests,
# not production code. Generated numeric tables and the built wasm bundle carry no
# maintainable signal, so they are excluded from analysis.
sonar.sources=src
sonar.tests=tests
sonar.exclusions=src/**/*_data.rs,web/pkg/**,target/**

# Coverage: reuse the CI LCOV report (cargo tarpaulin --out Lcov -> coverage/lcov.info).
sonar.rust.lcov.reportPaths=coverage/lcov.info

sonar.scm.provider=git
# Copy-paste detection is disabled on the declarative catalogs BELOW, and on nothing
# else. These files carry Kshana's evidence layer: the verification matrix rows, and
# the units-and-provenance contract naming every numeric field the engine emits
# (path, unit, provenance class, definition) in struct, tuple or macro-body form.
# Each row is distinct content in an identical shape, which is exactly what a
# copy-paste detector is built to flag -- and exactly what the audit surface of DONE
# criterion 4 requires to exist. Collapsing them would remove the thing a reviewer
# checks, so the duplication measure is corrected instead of the catalog.
#
# This key disables DUPLICATION DETECTION ONLY. Every one of these files is still
# fully analysed for bugs, vulnerabilities, code smells, coverage and hotspots. It is
# NOT sonar.exclusions, which would drop them from analysis entirely and would also
# break the coupling to tarpaulin's --exclude-files.
#
# tests/sonar_cpd_exclusions_are_justified.rs parses this list and fails if any entry
# is missing from disk or does not actually carry a catalog. A file may not be added
# here because excluding it helps the number.
sonar.cpd.exclusions=\
    src/altpnt/sequential.rs, \
    src/altpnt/terrain.rs, \
    src/attack_surface.rs, \
    src/conflict_threat_params.rs, \
    src/earth_gnss_lunar.rs, \
    src/ensemble.rs, \
    src/eo_payload.rs, \
    src/ephemeris.rs, \
    src/fusion/hybrid_ukf.rs, \
    src/fusion/mod.rs, \
    src/gnss_sim.rs, \
    src/hybrid_integrity.rs, \
    src/impairment_eval.rs, \
    src/inertial/coast.rs, \
    src/jamming.rs, \
    src/launch.rs, \
