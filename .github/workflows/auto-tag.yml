# SPDX-License-Identifier: AGPL-3.0-only
# Tag a release once main is green on the version bump: CI and the i18n workflow both.
#
# docs/RELEASING.md step 4 used to be a hand step: push `vX.Y.Z` on a commit that is already
# green on main. This workflow does that step and nothing else. When CI finishes green on a
# push to main, it reads the version from Cargo.toml; if no `vX.Y.Z` tag exists yet, it checks
# the version surfaces agree (scripts/check-version-sync.sh, as release.yml's verify does) and
# pushes an annotated tag on exactly the commit CI verified. release.yml then runs on that tag
# push, unchanged: verify -> release -> publish -> parity -> site.
#
# CI alone is not enough. At 0.41.0 the tag went out on a commit that was green in CI while
# the site check was red, so the release shipped and kshana.dev could not be redeployed from
# it. The site checks live in i18n.yml (its deploy-tree job builds the tree the way pages.yml
# does and opens it in a real browser), so this workflow runs when EITHER workflow completes
# and tags only when BOTH have a successful push run on exactly the same commit. The first of
# the two to finish finds the other still running and stops; the second one tags. A red run
# of either workflow on the commit fails this job with the reason, and nothing is tagged.
# i18n.yml runs on every push to main for this reason (no path filter on main pushes).
#
# It never moves or replaces a tag. A commit that is not main's head any more (main moved
# while CI ran) is skipped, so the tag always lands on the newest green commit that carries
# the bump.
#
# The tag is pushed with the RELEASE_TAG_TOKEN secret, not the workflow's own token: a tag
# pushed with GITHUB_TOKEN does not start other workflows, so release.yml would never run.
# The secret is a fine-grained token for this repository with Contents read and write. A
# missing secret fails the job instead of skipping it, so a bump is never left silently
# untagged.
name: Auto-tag
on:
  workflow_run:
    workflows: [CI, i18n]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: auto-tag
  cancel-in-progress: false
jobs:
  tag:
    # Only a green push run of this repository's own main; never a pull request's run.
    # (Either workflow; the step below requires the other one too.)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The tag token is present
        env:
          TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::RELEASE_TAG_TOKEN is not set (Settings -> Secrets and variables -> Actions); see docs/RELEASING.md"
            exit 1
          fi
      # Check out main itself, never the commit the triggering run names, then confirm main's
      # head IS that commit. The tag lands only on a commit that is both what CI verified and
      # what main holds now; if main moved on while CI ran, the run on the newer head tags it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TAG_TOKEN }}
      - name: Is there a new version to tag on this commit
        id: v
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^\[package\]/{p=1} p && /^version *=/{print $2; exit}' Cargo.toml)"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: $version (commit $SHA)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$SHA" ]; then
            echo "main moved on to $head while CI ran on $SHA; the run on the newer head tags it."
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"
      # Asked only when there is something to tag, so a red i18n run on an ordinary commit
      # does not turn this workflow red as well.
      - name: CI and i18n are both green on this commit
        id: gate
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          ready=true
          for wf in ci.yml i18n.yml; do
            # The newest push run of that workflow on main for exactly this commit.
            run="$(gh api "repos/$REPO/actions/workflows/$wf/runs?head_sha=$SHA&event=push&branch=main&per_page=1" \
                     --jq '.workflow_runs[0] | if . == null then "none" else "\(.status) \(.conclusion // "")" end')"
            echo "$wf on $SHA: $run"
            case "$run" in
              "completed success") ;;
              completed*)
                echo "::error::$wf is not green on $SHA ($run); not tagging. Fix it on main; the next commit green in both tags."
                exit 1 ;;
              none)
                echo "::error::$wf has no push run on $SHA (it runs on every push to main); not tagging."
                exit 1 ;;
              *)
                echo "$wf is still running on $SHA; its completion runs this workflow again and tags then."
                ready=false ;;
            esac
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Tag the version
        if: steps.v.outputs.new == 'true' && steps.gate.outputs.ready == 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          version: ${{ steps.v.outputs.version }}
          tag: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          # A run that finished just before this one may have tagged it already.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to do."
            exit 0
          fi
          GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$tag" ./scripts/check-version-sync.sh
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no [$version] section; see docs/RELEASING.md step 1"
            exit 1
          fi
          {
            echo "$tag"
            echo
            # Keep the first paragraph. awk reads to the end rather than exiting early: an early
            # exit closes the pipe, changelog-extract.sh dies writing to it, and pipefail fails
            # the step (that is how v0.30.0 went untagged).
            ./scripts/changelog-extract.sh "$version" | awk 'NF{p=1} p && !NF{d=1} p && !d'
          } > "$RUNNER_TEMP/tag-message.txt"
          git config user.name ashfordeOU
          git config user.email 236818772+ashfordeOU@users.noreply.github.com
          git tag -a "$tag" HEAD -F "$RUNNER_TEMP/tag-message.txt"
          git push origin "refs/tags/$tag"
          echo "Pushed $tag on $SHA; release.yml runs on it."
