# SPDX-License-Identifier: AGPL-3.0-only
# Publish the kshana-mcp Model Context Protocol server.
#
#   1. `image`    — build + push a multi-arch OCI image to GitHub Container Registry
#                   (ghcr.io). Uses the built-in GITHUB_TOKEN; no maintainer secret.
#   2. `registry` — register/refresh the server in the official MCP registry via
#                   GitHub OIDC (zero secrets). The registry reads the image's
#                   `io.modelcontextprotocol.server.name` label to verify ownership,
#                   so the image must exist and be PUBLIC first. Gated on the repo
#                   variable MCP_REGISTRY_PUBLISH=true so it stays inert until the
#                   maintainer makes the ghcr package public and opts in.
#
# Called by release.yml AFTER its `verify` job and after publish.yml (`needs:`), so the
# image is never pushed for a commit whose verification is not green, and never ahead of
# crates.io. It used to trigger on the tag push itself and race the verification. The
# manual-dispatch path (a retry, on a tag ref) is held by scripts/check-release-verdict.sh
# instead, and a dispatch from a branch is inert. (The `crates.io` publish of the same
# crate lives in publish.yml — that is the `cargo install kshana-mcp` channel; this
# workflow is the OCI / registry channel.)
name: publish MCP server

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.14.2); defaults to the tag"
        required: false
        type: string

permissions:
  contents: read

jobs:
  image:
    name: OCI image (ghcr.io)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: ghcr-image
      url: https://github.com/ashfordeOU/kshana/pkgs/container/kshana-mcp
    permissions:
      contents: read
      packages: write
      # SLSA build-provenance attestation of the pushed multi-arch image, signed by this
      # workflow's OIDC identity and pushed into ghcr.io alongside the image so that
      # `gh attestation verify oci://ghcr.io/<owner>/kshana-mcp:<ver>` succeeds.
      id-token: write
      attestations: write
      # scripts/check-release-verdict.sh reads the Release workflow's runs and jobs.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require a green release verdict for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-release-verdict.sh "$GITHUB_SHA"
      # This workflow publishes the TAG's version (server.json and the ghcr image tag are
      # stamped from it), so the tag-vs-manifest check runs HERE, ahead of the push, and
      # not only in publish.yml.
      - name: Version sync (tag == manifest)
        run: ./scripts/check-version-sync.sh
      - name: Resolve version + owner
        id: meta
        env:
          REF: ${{ github.ref }}
          INPUT: ${{ github.event.inputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$INPUT" ]; then v="$INPUT"; else v="${REF#refs/tags/v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Multi-arch (amd64 + arm64) so `docker run` works on x86 and Apple-Silicon hosts.
      # arm64 builds under QEMU emulation, so this is the slow job — it only runs per
      # release. (gha cache keeps re-runs fast.) Drop to linux/amd64 if speed matters.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: mcp/kshana-mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/kshana-mcp:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/kshana-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Attest the image by its immutable digest and push the attestation into ghcr.io so
      # a consumer can verify it directly from the registry (oci://…@<digest>).
      - name: Attest image build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.owner }}/kshana-mcp
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  registry:
    name: MCP registry (OIDC)
    needs: image
    # Inert until the maintainer makes the ghcr package public and sets this repo
    # variable (Settings → Secrets and variables → Actions → Variables).
    if: ${{ vars.MCP_REGISTRY_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: mcp-registry
      url: https://registry.modelcontextprotocol.io
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: mcp/kshana-mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve version + owner
        id: meta
        env:
          REF: ${{ github.ref }}
          INPUT: ${{ github.event.inputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$INPUT" ]; then v="$INPUT"; else v="${REF#refs/tags/v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Stamp server.json (version + image tag)
        env:
          V: ${{ steps.meta.outputs.version }}
          IMG: ghcr.io/${{ steps.meta.outputs.owner }}/kshana-mcp:${{ steps.meta.outputs.version }}
        run: |
          jq --arg v "$V" --arg img "$IMG" \
             '.version = $v | .packages[0].identifier = $img' \
             server.json > server.tmp && mv server.tmp server.json
          cat server.json
      - name: Install mcp-publisher (pinned, checksum-verified)
        # An exact release and its SHA-256, not `releases/latest`: this binary holds the
        # workflow's OIDC identity for the registry, so what runs must be what was
        # reviewed. The hash is the one the registry project publishes for this file in
        # registry_1.8.1_checksums.txt. Bump both together.
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          rm mcp-publisher.tar.gz
      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP registry
        run: ./mcp-publisher publish
