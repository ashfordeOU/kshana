# Checks the Apple signing and notarization secrets without signing, notarizing or publishing
# anything a user receives. Run it by hand (Actions → Apple signing check → Run workflow) after
# adding or renewing a certificate, an app-specific password or the Team ID.
#
# It:
#   1. imports both .p12 certificates into a temporary keychain and confirms each is a
#      Developer ID certificate (Application, Installer) issued to APPLE_TEAM_ID, and prints
#      how many days each has left;
#   2. signs a throwaway test binary with the hardened runtime and a secure timestamp, and
#      verifies the signature (the binary is deleted afterwards);
#   3. signs a throwaway test .pkg with the Installer identity and checks it;
#   4. logs in to Apple's notary service with the Apple ID and app-specific password
#      (`notarytool history`), which proves the credentials without submitting anything.
#
# Secret values are never printed. The keychain and every decoded file are removed at the end.
name: Apple signing check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Apple signing and notarization secrets
    runs-on: macos-14
    timeout-minutes: 15
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
      APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: All seven secrets are present
        run: |
          missing=0
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_INSTALLER_CERTIFICATE \
                   APPLE_INSTALLER_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::secret $v is missing or empty"; missing=1; else echo "ok  $v is set"; fi
          done
          if ! printf '%s' "$APPLE_TEAM_ID" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "::error::APPLE_TEAM_ID should be 10 upper-case letters or digits"; missing=1
          fi
          exit $missing

      - name: Import both certificates into a temporary keychain
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/applecheck"; mkdir -p "$W"
          KC="$W/check.keychain-db"; KCPW="$(uuidgen)"
          echo "KC=$KC" >> "$GITHUB_ENV"; echo "W=$W" >> "$GITHUB_ENV"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 900 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          if ! printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$W/app.p12" 2>/dev/null || [ ! -s "$W/app.p12" ]; then
            echo "::error::APPLE_CERTIFICATE is not valid base64 (re-copy it with: base64 -i file.p12 | pbcopy)"; exit 1; fi
          if ! printf '%s' "$APPLE_INSTALLER_CERTIFICATE" | base64 --decode > "$W/inst.p12" 2>/dev/null || [ ! -s "$W/inst.p12" ]; then
            echo "::error::APPLE_INSTALLER_CERTIFICATE is not valid base64"; exit 1; fi
          security import "$W/app.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign \
            || { echo "::error::APPLE_CERTIFICATE could not be imported: wrong APPLE_CERTIFICATE_PASSWORD, or the .p12 has no private key"; exit 1; }
          security import "$W/inst.p12" -k "$KC" -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign \
            || { echo "::error::APPLE_INSTALLER_CERTIFICATE could not be imported: wrong password, or the .p12 has no private key"; exit 1; }
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$W/app.p12" "$W/inst.p12"

      - name: Both are Developer ID certificates for this Team ID, with time left
        run: |
          set -euo pipefail
          check() {  # $1 = common-name prefix
            local pem="$W/cert.pem"
            security find-certificate -a -c "$1" -p "$KC" > "$pem" || true
            if [ ! -s "$pem" ]; then echo "::error::no '$1' certificate in the imported .p12"; return 1; fi
            local subj end days
            subj=$(openssl x509 -in "$pem" -noout -subject)
            end=$(openssl x509 -in "$pem" -noout -enddate | cut -d= -f2)
            days=$(python3 -c 'import sys,datetime as d;e=d.datetime.strptime(sys.argv[1],"%b %d %H:%M:%S %Y %Z");print((e-d.datetime.utcnow()).days)' "$end")
            if ! printf '%s' "$subj" | grep -q "($APPLE_TEAM_ID)"; then
              echo "::error::'$1' certificate is not issued to APPLE_TEAM_ID"; return 1; fi
            echo "ok  $1 certificate for Team ID $APPLE_TEAM_ID, valid until $end ($days days left)"
            if [ "$days" -lt 30 ]; then echo "::warning::$1 certificate expires in $days days; renew it"; fi
            rm -f "$pem"
          }
          check "Developer ID Application"
          check "Developer ID Installer"
          security find-identity -v -p codesigning "$KC" | grep -q "Developer ID Application" \
            || { echo "::error::the Application certificate has no usable private key for code signing"; exit 1; }
          echo "ok  Application identity usable for code signing"

      - name: Sign and verify a throwaway binary (hardened runtime, timestamp)
        run: |
          set -euo pipefail
          printf 'int main(void){return 0;}\n' > "$W/t.c"
          clang -arch arm64 -arch x86_64 -o "$W/kshana-signing-test" "$W/t.c"
          ID=$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          codesign --force --options runtime --timestamp --sign "$ID" --keychain "$KC" "$W/kshana-signing-test"
          codesign --verify --strict --verbose=2 "$W/kshana-signing-test"
          codesign -dv "$W/kshana-signing-test" 2>&1 | grep -E "^(Authority=Developer ID Application|TeamIdentifier|Runtime Version|Timestamp)" || true
          echo "ok  universal test binary signed with the hardened runtime and verified"

      - name: Sign and check a throwaway installer package
        run: |
          set -euo pipefail
          mkdir -p "$W/root/usr/local/bin"; cp "$W/kshana-signing-test" "$W/root/usr/local/bin/"
          pkgbuild --root "$W/root" --identifier dev.kshana.signing-test --version 0 "$W/unsigned.pkg" > /dev/null
          IID=$(security find-certificate -a -c "Developer ID Installer" "$KC" | awk -F'"' '/"labl"/{print $4; exit}')
          productsign --sign "$IID" --keychain "$KC" --timestamp "$W/unsigned.pkg" "$W/signed.pkg" > /dev/null
          pkgutil --check-signature "$W/signed.pkg" | grep -E "Status|Developer ID Installer" | head -3
          pkgutil --check-signature "$W/signed.pkg" | grep -q "signed by a developer certificate issued by Apple for distribution" \
            || { echo "::error::installer package signature is not a Developer ID distribution signature"; exit 1; }
          echo "ok  test installer package signed with the Installer identity"

      - name: Notarization login works (nothing is submitted)
        run: |
          set -uo pipefail
          if xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" > "$W/hist.txt" 2>&1; then
            echo "ok  notary service accepted the Apple ID, app-specific password and Team ID"
            echo "    previous submissions on this team: $(grep -c 'id:' "$W/hist.txt" || true)"
          else
            echo "::error::notary login failed: check APPLE_ID, APPLE_APP_PASSWORD (an app-specific password from appleid.apple.com, not the account password) and APPLE_TEAM_ID"
            grep -iE "error|unauthori|invalid" "$W/hist.txt" | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<apple-id>/g' | head -5
            exit 1
          fi

      - name: Clean up
        if: always()
        run: |
          [ -n "${KC:-}" ] && security delete-keychain "$KC" 2>/dev/null || true
          [ -n "${W:-}" ] && rm -rf "$W" || true
          echo "temporary keychain and files removed"
