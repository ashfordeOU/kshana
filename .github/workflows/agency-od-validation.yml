# Full-arc precise-orbit validation against real agency products.
#
# MANUAL ONLY (`workflow_dispatch`): never triggered by push or pull_request, so it can
# NEVER block `main`. The gating CI already runs the vendored-fixture validation
# (`tests/agency_galileo.rs`, an 8-hour Galileo arc at d/o-12) with no network. This job
# downloads the full-day products and runs the same pipeline over the whole arc at full
# geopotential degree (d/o-70) — the reproducible "exact-named product" layer of the data
# strategy. No inputs: the canonical runs are Galileo E11 and Swarm-A (L47), 2022-001, d/o-70,
# as two independent jobs.
#
# Sources (open, no login):
#   ESA/ESOC final multi-GNSS orbit  http://navigation-office.esa.int/products/gnss-products/
#   ESA Swarm L2 RD orbit (SP3ACOM) https://swarm-diss.eo.esa.int/ (the ?do=download endpoint)
#   IERS finals2000A (UT1-UTC, pole) https://datacenter.iers.org/data/9/finals2000A.all
name: Agency precise-OD validation (full arc)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  KSHANA_GALILEO_SP3: orbit.sp3
  KSHANA_GALILEO_EOP: finals2000A.all
  KSHANA_GALILEO_SAT: E11
  KSHANA_GALILEO_DEGREE: "70"
jobs:
  galileo-full-arc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The pinned channel, like every other workflow (scripts/check-toolchain.sh enforces it).
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master; the toolchain is the `toolchain` input below
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Fetch the full-day Galileo orbit (ESA0MGNFIN, GPS week 2190 / 2022-001)
        run: |
          set -euo pipefail
          base=http://navigation-office.esa.int/products/gnss-products/2190
          curl -fSL "$base/ESA0MGNFIN_20220010000_01D_05M_ORB.SP3.gz" -o orbit.sp3.gz
          gunzip -f orbit.sp3.gz
      - name: Fetch the IERS finals2000A Earth-orientation series
        run: curl -fSL "https://datacenter.iers.org/data/9/finals2000A.all" -o finals2000A.all
      - name: Run the full-arc fit (release build; asserts < 5 m)
        run: cargo test --release --test agency_galileo galileo_full_arc_dispatch -- --ignored --nocapture
  swarm-full-arc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KSHANA_SWARM_SP3: swarm.sp3
      KSHANA_SWARM_EOP: finals2000A.all
      KSHANA_SWARM_SAT: L47
      KSHANA_SWARM_DEGREE: "70"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The pinned channel, like every other workflow (scripts/check-toolchain.sh enforces it).
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master; the toolchain is the `toolchain` input below
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Fetch the full-day Swarm-A orbit (SW_OPER_SP3ACOM_2_, 2022-001)
        run: |
          set -euo pipefail
          dir='swarm%2FLevel2daily%2FLatest_baselines%2FPOD%2FRD%2FSat_A'
          name=SW_OPER_SP3ACOM_2__20211231T235942_20220101T235942_0201
          curl -fSL "https://swarm-diss.eo.esa.int/?do=download&file=$dir%2F$name.ZIP" -o swarm.zip
          unzip -o swarm.zip "$name.sp3"
          mv "$name.sp3" swarm.sp3
      - name: Fetch the IERS finals2000A Earth-orientation series
        run: curl -fSL "https://datacenter.iers.org/data/9/finals2000A.all" -o finals2000A.all
      - name: Run the full-arc reduced-dynamic fit (release build; asserts < 5 m)
        run: cargo test --release --test agency_swarm swarm_full_arc_dispatch -- --ignored --nocapture
