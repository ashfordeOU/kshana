name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
# Scoped to the COMMIT, not just the branch. With a branch-wide group every push to main
# cancelled the previous commit's verification mid-flight, so on a busy day every commit
# but the newest carried a cancelled run — indistinguishable at a glance from a failure,
# and it destroys the record of whether that commit actually passed. Worse, re-running an
# older run then evicted the CURRENT one (this cost 7864142 its coverage job at 87 of ~92
# minutes). Keying on the SHA still collapses duplicate runs of the same commit, which is
# all cancel-in-progress was ever needed for here.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    # The umbrella gate runs the full `cargo test --all`, which includes the
    # multi-minute end-to-end validation binaries (agency_lro ~24 min,
    # agency_swarm ~11 min, the P1-P6 paper cross-checks).
    #
    # Healthy steady-state is ~62-79 min. During the v0.25.0 cut this job was cancelled
    # at its cap twice (41c5ea1 at 120, e1a2cb0 at 240) and earlier explanations here
    # blamed cold caches — wrong: the kill logs of every cancelled run name the same
    # orphan process, the tests/property.rs `run_toml` fuzzer, still running hours after
    # everything else finished. Its corpus was read in `read_dir` (filesystem-random)
    # order, so each run drew a different mutation workload — a per-run lottery from
    # minutes to hours on identical code. Fixed at the source: the corpus is now sorted
    # (deterministic workload) and the loop is wall-clock-budgeted — see that test's
    # comment. The 240 cap stays as pure headroom: it costs nothing when healthy, and a
    # cap that clips a passing run reveals nothing (a job cancelled at its cap never
    # reveals its true runtime). No gate below is weakened.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the repository-hygiene guard scans every commit message,
          # not just the shallow tip (default fetch-depth 1 silently blinds the scan).
          fetch-depth: 0
      # Pinned to the exact version in rust-toolchain.toml for a reproducible build.
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Toolchain pin guard
        run: ./scripts/check-toolchain.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
      - name: Reproducibility guard
        run: ./scripts/check-reproducible.sh
      - name: Repository hygiene guard
        run: ./scripts/check-no-attribution.sh
      - name: Version consistency guard
        run: ./scripts/check-version-sync.sh
      - name: Documentation-coverage ratchet
        run: ./scripts/check-doc-coverage.sh
      - name: SBOM generation guard
        run: ./scripts/gen-sbom.sh > /dev/null
  package:
    # Build the exact tarball crates.io receives, and compile it.
    #
    # WHY THIS JOB EXISTS
    #   `cargo package` runs a verification build against ONLY the files the tarball
    #   carries. That is a different file set from the working tree, so a library that
    #   compiles here can still fail there — and nothing else in CI notices, because
    #   every other job builds from the full checkout.
    #
    #   It happened. src/lunar_orientation.rs holds a top-level `include_str!` of
    #   tests/fixtures/llr_geometry/de440_moon_pa.csv, and the manifest excludes
    #   /tests/fixtures from the package. The v0.27.0 publish was the first thing to run
    #   `cargo package`, it failed there, and by then npm and PyPI had already published
    #   — publish.yml's jobs are independent, so a crates.io failure does not stop them.
    #   A half-released version is the worst outcome available, and a tag is far too late
    #   to discover it.
    #
    #   Every other src/ `include_str!` of a fixture sits inside a #[cfg(test)] module and
    #   so never reaches the packaged library. Only a top-level one does. This job is the
    #   difference between finding that on a push and finding it mid-release.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo package --locked
  msrv:
    # Does the crate still build on the OLDEST compiler Cargo.toml promises? That promise
    # is the `rust-version` field, and a consumer stuck on that compiler is its only reader.
    #
    # For ten releases this job tested nothing of the sort. dtolnay/rust-toolchain runs
    # `rustup default <ver>`, the LOWEST-precedence toolchain selector rustup has:
    # rust-toolchain.toml outranks it, so every step below silently compiled on the pinned
    # 1.93.0 and the job reported a pass it had never earned. The proof is that it stayed
    # green while pinned at 1.75.0 — Cargo.lock is lockfile v4, which cargo before 1.78
    # refuses to parse at all, so a genuine 1.75.0 run could not have compiled one line.
    # RUSTUP_TOOLCHAIN sits at precedence 2, above the toolchain file, and is what actually
    # pins the compiler here. Measured: `RUSTUP_TOOLCHAIN=1.85.0 cargo build --all --locked`
    # is clean in 32s on this tree.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Keep in lockstep with `rust-version` in Cargo.toml. The guard step below fails the
      # job if the two disagree, so the pin cannot drift out from under the claim again.
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Assert the compiler in use IS the declared MSRV
        # Grades both halves of what this job claims: that RUSTUP_TOOLCHAIN really did beat
        # rust-toolchain.toml, and that the pin above still equals the rust-version the
        # published crate advertises. Either one drifting turns the job red instead of quiet.
        run: |
          set -euo pipefail
          declared=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          active=$(rustc --version | awk '{print $2}')
          echo "declared rust-version=$declared, active rustc=$active"
          case "$active" in
            "$declared"|"$declared".*) ;;
            *) echo "::error::msrv job is compiling with rustc $active, not the declared rust-version $declared"; exit 1 ;;
          esac
      # --locked as well as --all: the MSRV claim is about the lockfile we ship, and a
      # resolver that is free to pick newer crates is not testing the graph consumers get.
      - run: cargo build --all --locked
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Install cargo-deny as a prebuilt binary from its GitHub release rather
      # than via EmbarkStudios/cargo-deny-action, which builds a Docker image
      # `FROM rust:...-alpine` on every run and intermittently fails when the
      # Docker Hub registry pull times out ("dial tcp ...: i/o timeout"). The
      # binary install has no Docker Hub dependency. cargo-deny reads
      # Cargo.lock + deny.toml and needs no project compilation.
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: cargo-deny
      - name: cargo-deny
        # --all-features, because the default resolve omits the crates that only the
        # shipped feature sets pull in. pyo3 is `optional = true` behind the `python`
        # feature, so without this flag the eight-crate pyo3 tree compiled into every
        # PyPI wheel (publish.yml builds with --features python) is inspected by no
        # advisory, licence, ban or source check anywhere in the repo. (The wasm-bindgen
        # tree was already covered: Cargo.toml pulls it in through a TARGET-gated
        # getrandom dependency, which cargo-deny sees regardless of features.) The flag
        # is a top-level cargo-deny option and must precede `check`. Measured on this
        # tree: 57 crates inspected without it, 65 with; both verdicts clean today, so
        # the change adds coverage without turning the gate red.
        run: cargo deny --all-features check advisories licenses bans sources
  coverage:
    runs-on: ubuntu-latest
    # Source-based LLVM instrumentation runs the same full suite as `check` under
    # coverage counters. Healthy steady-state is ~91-94 min.
    #
    # This job was cancelled at its cap three times during the v0.25.0 cut (180 min on
    # 3076e95 twice, 240 min on e1a2cb0 — the last one even after its iterations were
    # reduced under instrumentation). Every kill log names the same orphan process: the
    # tests/property.rs `run_toml` fuzzer. Its corpus was read in `read_dir`
    # (filesystem-random) order, so each run drew a different mutation workload, and a
    # mutant that stays valid EXECUTES — a byte flip in a cost knob makes it far more
    # expensive than any bundled scenario. That per-run lottery is why sonarcloud.yml
    # once ran the identical tarpaulin workload to success in 93 min on a commit where
    # this job hung twice. Fixed at the source: sorted (deterministic) corpus + a
    # wall-clock budget + a 300-iteration prefix under `cfg(tarpaulin)` — see that
    # test's comment. The 240 cap stays as pure headroom; a job cancelled at its cap
    # never reveals its true runtime.
    #
    # The measurement and the --fail-under 85 floor below are unchanged.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          # The LLVM source-based coverage engine needs llvm-profdata/llvm-cov,
          # shipped by this component.
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: cargo-tarpaulin
      - name: Coverage (LLVM engine, enforced line floor)
        # Source-based LLVM instrumentation (the same coverage family as
        # `cargo llvm-cov`), reported as an lcov artifact and gated on a line
        # floor. Generated data tables, the thin CLI entrypoint, the tests
        # themselves, and the web assets are excluded from the measurement.
        # The floor is 85% — above the >=80% target and comfortably under the
        # measured ~96% line coverage on src/ — so it guards against regressions
        # without flaking. SGP4 and the clock modules sit at >=95%.
        #
        # --timeout is tarpaulin's per-test "no response" limit, not a budget for the
        # whole job. At 900 s it killed the run on
        # agency_swarm::swarm_a_leo_reduced_dynamic_fit — a real ESA Swarm-A LEO
        # reduced-dynamic fit at geopotential degree 70, whose differential correction
        # evaluates the full force model over the arc once per iteration. Measured on
        # an arm64 laptop, debug build, NO instrumentation: agency_swarm 691 s and
        # agency_lro 2250 s. Both tests were already present on 7bba514, whose coverage
        # job passed in 91 minutes under this same 900 s limit, so the instrumented fit
        # used to land just inside it: the setting was marginal, not newly broken.
        # 3600 s restores headroom without hiding a hang — the job's own 240-minute
        # ceiling is the real backstop. If this trips again the answer is NOT a bigger
        # number, it is to take the multi-minute agency fits out of the coverage run
        # and leave them to scripts/gate.sh, which runs them for correctness anyway.
        #
        # These lines are YAML comments ABOVE `run:` on purpose. `run: >` is a FOLDED
        # scalar: every line is joined into one shell command, so a `#` placed inside
        # it is not a comment — it comments out the REST OF THE COMMAND. That mistake
        # shipped once here, silently dropping --timeout and --fail-under and leaving
        # an unmatched apostrophe from the word "tarpaulin's". It parsed as valid YAML.
        run: >
          cargo tarpaulin --engine llvm --out Lcov --output-dir coverage
          --exclude-files 'src/*_data.rs'
          --exclude-files 'src/main.rs'
          --exclude-files 'tests/*'
          --exclude-files 'web/*'
          --timeout 3600 --fail-under 85
      - name: Upload lcov report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
  reproducibility-matrix:
    # Prove cross-platform reproducibility on the three tier-1 desktop OSes. Full
    # result JSON is not byte-identical across targets (last-ULP libm divergence),
    # so we assert the reproducibility invariants that ARE platform-independent:
    # the input fingerprint + output shape (tests/cross_platform_golden.rs, exact
    # SHA-256 goldens in tests/golden/), the pinned numerics to 1e-6 (golden.rs),
    # same-process byte-identity (determinism.rs), and the SGP4 states to 2e-5 km
    # against the AIAA reference (sgp4_verification.rs). See docs/REPRODUCIBILITY.md.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Cross-platform reproducibility tests
        run: >
          cargo test
          --test cross_platform_golden
          --test golden
          --test determinism
          --test sgp4_verification
  test-python-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      # Build the wheel with PyO3/maturin-action, which runs maturin inside a
      # manylinux container. This deliberately avoids a raw host `maturin build`
      # + dtolnay/rust-toolchain combination: on the ubuntu-latest runner image
      # that path intermittently fails when rustup tries to install the
      # rustfmt-preview component and collides with the image's pre-installed
      # `~/.cargo/bin/cargo-fmt` ("detected conflict: 'bin/cargo-fmt'"). The
      # container ships its own clean toolchain, so the conflict cannot occur.
      - name: Build the Python wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: --features python --out dist
          # Match the release wheel's ABI floor (wheels.yml) so the gating build
          # and the published build use the identical manylinux_2_28 container.
          manylinux: 2_28
      - name: Install test deps
        run: pip install pytest numpy
      - name: Install the wheel
        run: pip install --no-index --find-links dist kshana
      - name: Run binding smoke tests
        run: pytest -q tests/python
      # kshana.pyi is hand-written, and nothing compared it to the extension it describes:
      # `csv` and `write_csv` shipped on RunOutput without a stub. stubtest imports the
      # INSTALLED wheel (it runs outside the checkout for that reason) and fails on a
      # missing, extra or re-signatured attribute. The one allowlist entry is the compiled
      # submodule itself, which has no stub of its own by design.
      - name: Check the type stub against the built extension
        run: |
          pip install mypy
          printf 'kshana\\.kshana\n' > "$RUNNER_TEMP/stubtest-allow.txt"
          cd "$RUNNER_TEMP" && python -m mypy.stubtest kshana --allowlist "$RUNNER_TEMP/stubtest-allow.txt"
  test-wasm-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build the WebAssembly module
        # --no-opt skips the wasm-opt pass so this CI verification job never has to
        # download binaryen from the GitHub release CDN (a recurring transient
        # failure point). The build is functionally identical; the size-optimized
        # wasm-opt pass is kept for the deployed playground in pages.yml / publish.yml.
        run: wasm-pack build --target web --out-dir web/pkg --release --no-opt -- --features wasm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Assert every web test file has a step
        # The test steps below are written out one per file so the Actions UI names which
        # module failed. Nothing used to assert that the list was complete, so adding a
        # new web/*.test.mjs without adding a step here would leave it untested with CI
        # green. This compares the two sets in both directions instead: a file on disk
        # with no step, or a step naming a file that no longer exists, fails here.
        run: |
          set -euo pipefail
          diff <(find web -maxdepth 1 -name '*.test.mjs' | sort) \
               <(grep -oE '^ +run: node web/[A-Za-z0-9_.-]+\.test\.mjs$' .github/workflows/ci.yml \
                 | awk '{print $3}' | sort -u) \
            || { echo "::error::web/*.test.mjs and the steps in ci.yml disagree (< on disk, > enumerated)"; exit 1; }
          echo "OK: every web/*.test.mjs has its own step in ci.yml"
      - name: Run wasm smoke test
        run: node web/smoke.mjs
      - name: Test the share-link codec
        run: node web/share.test.mjs
      - name: Test the chart-download helpers
        run: node web/chartdl.test.mjs
      - name: Test the off-main-thread engine client
        run: node web/engine.test.mjs
      - name: Test the A/B compare logic
        run: node web/compare.test.mjs
      - name: Test the chart-hover logic
        run: node web/hover.test.mjs
      - name: Test the 3D orbit renderer math
        run: node web/orbit3d.test.mjs
      - name: Test the parameter-sweep helpers
        run: node web/sweep.test.mjs
      - name: Test the guided-knob helpers
        run: node web/guided.test.mjs
      - name: Test the multi-run overlay logic
        run: node web/overlay.test.mjs
      - name: Test the tabbed-output model
        run: node web/tabs.test.mjs
      - name: Test the embed-mode helpers
        run: node web/embed.test.mjs
      - name: Test the HTML-report builder
        run: node web/report.test.mjs
      - name: Test the guided-tour core
        run: node web/tour.test.mjs
  # ---------------------------------------------------------------------------
  # Overlay-registry assurance gates (Phase 0).
  #
  # These two jobs pin the public crate's standalone health independently of the
  # umbrella `check` job: that the kshana library builds + tests on its own (so
  # the registry conformance suite, tests/conformance.rs, always runs and the
  # dispatch seam can never silently drift from registry::ids::all()), and that
  # the library still compiles for the WASM target the registry was designed to
  # stay friendly to (BTreeMap/Cow, no SystemTime::now()). The conformance test
  # itself also runs in the `check` job's `cargo test --all`; this is a focused,
  # faster-failing restatement scoped to the public crate.
  # ---------------------------------------------------------------------------
  public-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build the public crate standalone
        run: cargo build -p kshana
      # Scope to the crate's unit tests plus the registry dispatch-seam suite. The
      # multi-minute agency/precise-OD validation binaries (agency_lro ~24 min,
      # agency_swarm ~11 min, property, ...) already run in the `check` job's
      # `cargo test --all`; re-running them here overran the focused 30-min budget
      # for zero extra coverage (single crate: `-p kshana` == `--all`), which is
      # what this job's "faster-failing restatement" header promises to avoid.
      - name: Test the public crate (unit tests + registry conformance/dispatch seam)
        run: cargo test -p kshana --lib --test conformance --test external_pack --test registry_golden
  wasm-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build the public crate for wasm32-unknown-unknown
        # Proves the registry/assurance seam stays no_std/WASM-safe. Scoped to
        # --lib: the registry lives in the library, and the crate's native-only
        # binaries (e.g. gen_validation_artifacts) are not WASM targets.
        run: cargo build -p kshana --lib --target wasm32-unknown-unknown
  # ---------------------------------------------------------------------------
  # The MCP server crate (mcp/kshana-mcp).
  #
  # It is EXCLUDED from the root package — Cargo.toml lists "/mcp" in `exclude` — and
  # carries its OWN Cargo.lock, so root `cargo test --all` and root `cargo deny` reach
  # not one line of it. Until these two jobs existed, nothing on any push ran the six
  # protocol round-trip tests in mcp/kshana-mcp/tests/round_trip.rs, and no advisory,
  # licence, ban or source check had ever seen that crate's dependency graph. The crate
  # is published on every release — crates.io, ghcr.io and the MCP registry — so the
  # unverified surface was a shipped one.
  #
  # Same shape frame-xval.yml uses for the other workspace-excluded crate
  # (xval/anise-frames): check out, pin the toolchain, cache under the crate's own
  # workspace key, run cargo from its directory. Unlike that one, these gate: they run
  # on push and pull_request with everything else in this file.
  # ---------------------------------------------------------------------------
  mcp-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mcp/kshana-mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pinned to the repo toolchain like every other job. The crate is edition 2024
      # (the rmcp SDK); rmcp 2.x needs >= 1.88 (darling 0.23); 1.93.0 satisfies both.
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # The crate sits outside the root package and has its own lockfile and target
          # dir, so the cache key has to name it or every run is a cold build.
          workspaces: mcp/kshana-mcp
      - name: Test the MCP server (protocol round-trip over an in-memory duplex)
        # tests/round_trip.rs drives the real server with an in-process rmcp client and
        # asserts the served tool set EXACTLY, in both directions — that is the check
        # that catches a core export which never reached an agent (export_oem did, and
        # the containment-only predecessor of that test stayed green throughout).
        # --locked because the crate ships its own Cargo.lock and the publish path
        # builds from it; a resolve that drifts here is not the graph we release.
        run: cargo test --locked
  mcp-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mcp/kshana-mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Prebuilt binary, same as the root `deny` job and for the same reason (no Docker
      # Hub dependency). cargo-deny reads Cargo.lock + deny.toml and compiles nothing.
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: cargo-deny
      - name: cargo-deny over the MCP server's own lockfile
        # Run from mcp/kshana-mcp so cargo-deny resolves THAT Cargo.lock. It walks up for
        # its config, so it shares the root deny.toml — deliberate: one licence policy for
        # everything this repository publishes. The `kshana-mcp` entry in that file's
        # `exceptions` exists for this run, where our own AGPL-3.0-only crate is the root
        # of the graph being inspected.
        #
        # No --all-features here, unlike the root job. kshana-mcp declares no features of
        # its own, so the flag would only switch on the `python`/`wasm` features of the
        # path dependency kshana and inspect a pyo3 + wasm-bindgen tree that the MCP
        # binary, its image and its crates.io release never build. Those trees are already
        # covered by the root `deny` job against the root lockfile.
        run: cargo deny check advisories licenses bans sources
