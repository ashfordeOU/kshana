# SPDX-License-Identifier: AGPL-3.0-only
# Build the WebAssembly playground and publish it to GitHub Pages.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust (with wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build playground
        run: ./web/build.sh
      - name: Stage the deploy tree
        # upload-pages-artifact used to be pointed at web/ itself, so the whole build
        # directory was the production origin: https://kshana.dev/build.sh,
        # /smoke.mjs, /README.md and each of the twelve *.test.mjs files all returned
        # 200, and robots.txt is allow-all, so they were crawlable too. None of them is
        # site content. rsync into a staging tree and upload that instead.
        #
        # This must run AFTER build.sh, which is what creates web/pkg, web/scenarios and
        # web/assets. Nothing depends on the dropped files being served: ci.yml runs the
        # node tests from the checkout, and publish.yml rebuilds web/pkg for npm on its
        # own. The README exclude is anchored (`/README.md`) so it drops only the
        # top-level one — web/pkg/README.md is staged by build.sh for the npm package and
        # an unanchored pattern would take it too.
        #
        # Measured on this tree: 124 files in web/, 109 staged — exactly the 12 test
        # files plus smoke.mjs, build.sh and README.md.
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '*.test.mjs' \
            --exclude 'smoke.mjs' \
            --exclude 'build.sh' \
            --exclude '/README.md' \
            web/ site/
          echo "staged $(find site -type f | wc -l | tr -d ' ') of $(find web -type f | wc -l | tr -d ' ') file(s)"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
