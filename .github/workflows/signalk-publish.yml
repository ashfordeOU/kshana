# SPDX-License-Identifier: AGPL-3.0-only
# Publish the Signal K plugin (integrations/signalk) to npm as its own package.
#
# OFF BY DEFAULT. Nothing here runs until the founder has approved the package name and
# its first publish and set BOTH repository variables:
#   SIGNALK_NPM_PUBLISH = true
#   SIGNALK_NPM_PACKAGE = <the approved package name>
# and the name in integrations/signalk/package.json equals SIGNALK_NPM_PACKAGE (checked
# below), so a rename in a commit cannot publish under a name nobody approved.
# Called by release.yml after `verify` and `publish`, on a tag push only.
#
# Signal K's app store finds plugins by the `signalk-node-server-plugin` keyword in
# package.json, which the package carries.
#
# First publish of a NEW npm package cannot use trusted publishing (the package must exist
# before a trusted publisher can be attached on npmjs.com), so that publish needs NPM_TOKEN;
# afterwards trusted publishing with workflow `release.yml` works as for `kshana`
# (docs/RELEASING.md).
name: publish Signal K plugin
on:
  workflow_call:
permissions:
  contents: read
jobs:
  gate:
    name: enabled?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.g.outputs.enabled }}
    steps:
      - id: g
        env:
          ON: ${{ vars.SIGNALK_NPM_PUBLISH }}
        run: |
          if [ "$ON" = "true" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "::notice::Signal K npm publish is OFF (repository variable SIGNALK_NPM_PUBLISH is not 'true')"; fi
  npm:
    name: npm (Signal K plugin)
    needs: gate
    if: needs.gate.outputs.enabled == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require a green release verdict for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-release-verdict.sh "$GITHUB_SHA"
      - name: Version sync (tag == manifest == package.json)
        run: ./scripts/check-version-sync.sh
      - name: The package name is the approved one, and the package is publishable
        env:
          APPROVED: ${{ vars.SIGNALK_NPM_PACKAGE }}
        run: |
          set -euo pipefail
          python3 - "$APPROVED" <<'PY'
          import json, sys
          p = json.load(open("integrations/signalk/package.json"))
          approved = sys.argv[1]
          assert approved, "repository variable SIGNALK_NPM_PACKAGE is not set"
          assert p["name"] == approved, f"package.json name {p['name']!r} != approved {approved!r}"
          assert not p.get("private"), "package.json still has \"private\": true; npm refuses to publish it"
          assert "signalk-node-server-plugin" in p.get("keywords", []), "missing the signalk-node-server-plugin keyword"
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@^11.5.1
      - name: Fetch the tarball the artefacts job packed (the bytes the release attests)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: channel-signalk
          path: signalk-dist
      - name: Publish (an already-published version counts as success)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          # The token reaches npm only when set: an empty NODE_AUTH_TOKEN must not stand
          # in the way of trusted publishing (same as publish.yml).
          if [ -n "$NPM_TOKEN" ]; then export NODE_AUTH_TOKEN="$NPM_TOKEN"; fi
          # Leading ./ is load-bearing: npm reads a bare dir/file.tgz as a GitHub shorthand.
          tarball="$(ls ./signalk-dist/*.tgz)"
          [ "$(printf '%s\n' "$tarball" | wc -l)" -eq 1 ] || { echo "::error::expected one tarball, found: $tarball"; exit 1; }
          out="$(npm publish "$tarball" --access public --provenance 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$out" | grep -qiE "cannot publish over|previously published|EPUBLISHCONFLICT|cannot modify pre-existing version" \
              && { echo "::notice::this version is already on npm — treating as success"; exit 0; }
            exit "$rc"
          fi
