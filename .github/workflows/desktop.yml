name: Desktop
# Kshana Desktop (apps/desktop): build and test the application on the three platforms
# and keep the unsigned bundles as artefacts. Signing is not part of this workflow.
on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", "web/studio/**", "src/**", "Cargo.toml", "Cargo.lock", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["apps/desktop/**", "web/studio/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master; the toolchain is the `toolchain` input below
        with:
          toolchain: 1.93.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Stage the frontend
        shell: bash
        run: apps/desktop/build-frontend.sh
      - name: Format
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test the native bridge
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Bundle (unsigned)
        shell: bash
        run: |
          cargo install tauri-cli --version "^2" --locked
          cd apps/desktop/src-tauri && cargo tauri build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kshana-desktop-unsigned-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
