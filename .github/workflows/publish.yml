# SPDX-License-Identifier: AGPL-3.0-only
# Publish Kshana to crates.io, PyPI, and npm.
#
# Triggered by pushing a release tag (vX.Y.Z) or by manual dispatch. (The
# `release: published` event is intentionally not used: releases created by the
# Release workflow's GITHUB_TOKEN do not trigger downstream workflows, so that
# trigger would never fire.) Each job is gated on its registry token — with the
# token unset the publish step is skipped and the job still succeeds, so the
# workflow is inert until the maintainer adds the secret. Every publish is
# idempotent: re-running after a version is already live is a no-op success, so a
# partial failure (one registry) can be retried safely without touching the others.
#
# PyPI works exactly like the other registry jobs: the wheels/sdist build as
# artifacts first (each SLSA build-provenance attested), then a single publish job
# uploads them, gated on the PYPI_API_TOKEN secret. With the token unset the upload
# is skipped and the job still succeeds; with it set every tagged version uploads
# automatically. (PEP 740 upload attestations require OIDC Trusted Publishing and are
# therefore off under token auth — but the GitHub SLSA attestation of every uploaded
# file is emitted regardless and is verifiable with `gh attestation verify`.)
#
# Every distributed artifact (crate tarball, wheels, sdist, npm tarball) gets a
# cryptographic SLSA build-provenance attestation (actions/attest-build-provenance)
# so a consumer can verify, with `gh attestation verify`, that the exact bytes they
# downloaded were produced by this workflow from this repository.
#
# Two guards sit in front of every publish, because these publishes cannot be taken
# back: the `gates` job below (cheap script gates, see its own comment) which every
# publishing job `needs:`, and `if: startsWith(github.ref, 'refs/tags/v')` on each of
# them, so a manual dispatch from a branch is inert rather than publishing whatever is
# on that branch. A dispatch can still select a tag ref, which is the documented retry
# path, and that keeps working.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Cheap correctness gates, run before anything irreversible.
  #
  # crates.io yanks rather than deletes and PyPI refuses a re-upload of a filename, so
  # a publish is final. release.yml does run the full fmt/clippy/`cargo test --all`
  # suite on this same tag push, but it is a SEPARATE workflow and `needs:` is
  # intra-workflow only, so the publishes never waited for it. Measured from the run
  # history, v0.27.2 (tag pushed 00:04:09): crates.io finished 00:05:03, npm 00:07:14,
  # PyPI 00:08:35 — while release.yml's `verify` did not return until 01:28:07. The
  # crate was public and unrecallable for 83 minutes before anything said the suite
  # passed. Same shape on v0.27.1 (PyPI 08:54:54, verdict 09:56:29) and on v0.27.0,
  # where npm and PyPI both succeeded while the crates.io job FAILED at 07:38:22 — the
  # half-release ci.yml's `package` job comment records.
  #
  # Re-running the 240-minute suite here would double the runner cost per release and
  # add a second independent flake lottery that a tag must also win, so this job carries
  # only the seconds-long script gates — the ones that catch a drifted or mis-tagged
  # tree. The long suite stays where it is, in release.yml. This narrows the race; it
  # does not close it.
  gates:
    name: pre-publish gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: check-no-attribution.sh scans every commit message, and the
          # default shallow checkout silently blinds that scan (same reason as ci.yml).
          fetch-depth: 0
      # Pinned to rust-toolchain.toml rather than @stable, because check-toolchain.sh
      # asserts the active rustc equals the pinned channel — a floating stable fails it.
      - uses: dtolnay/rust-toolchain@1.93.0
      - name: Toolchain pin guard
        run: ./scripts/check-toolchain.sh
      - name: Version consistency guard
        run: ./scripts/check-version-sync.sh
      - name: Repository hygiene guard
        run: ./scripts/check-no-attribution.sh

  crates:
    name: crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: gates
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: crates-io
      url: https://crates.io/crates/kshana
    permissions:
      contents: read
      # SLSA build-provenance attestation of the packaged .crate tarball.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package the crate (the exact tarball crates.io receives)
        # `cargo package` produces target/package/<name>-<ver>.crate — the byte-for-byte
        # tarball `cargo publish` uploads. Attesting it (below) ties the published crate
        # to this workflow run. --locked so the SBOM/graph matches Cargo.lock.
        run: cargo package --locked
      - name: Attest build provenance (.crate)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "target/package/*.crate"
      - name: Gate on token
        id: gate
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "go=true" >> "$GITHUB_OUTPUT";
          else echo "CARGO_REGISTRY_TOKEN not set; skipping crates.io publish"; fi
      - name: Publish
        if: steps.gate.outputs.go == 'true'
        env:
          # cargo reads CARGO_REGISTRY_TOKEN from the environment (no deprecated --token).
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          # Reuse the already-packaged tarball (no second package step / re-verify).
          out="$(cargo publish --locked --no-verify 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$out" | grep -qiE "already (exists|uploaded)|already been published|is already uploaded" \
              && { echo "::notice::this version is already on crates.io — treating as success"; exit 0; }
            exit "$rc"
          fi

  crates-mcp:
    name: crates.io (kshana-mcp)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: crates-io-mcp
      url: https://crates.io/crates/kshana-mcp
    # The MCP server is a standalone, workspace-excluded crate that depends on the
    # published `kshana` crate (`kshana = { path = "../..", version = "<major.minor>" }`
    # in mcp/kshana-mcp/Cargo.toml, kept equal to the engine's major.minor by
    # scripts/check-version-sync.sh), so it must publish AFTER the `crates` job has
    # pushed a matching `kshana` to crates.io. The requirement is deliberately not
    # quoted here: the last time it was, the comment said 0.14 fifteen minor releases
    # after the manifest had moved on.
    needs: crates
    if: startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: mcp/kshana-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Gate on token
        id: gate
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "go=true" >> "$GITHUB_OUTPUT";
          else echo "CARGO_REGISTRY_TOKEN not set; skipping kshana-mcp publish"; fi
      - name: Publish
        if: steps.gate.outputs.go == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          # Retry briefly: the `kshana` version this depends on may still be propagating
          # through the crates.io sparse index right after the `crates` job published it.
          for attempt in 1 2 3 4 5; do
            out="$(cargo publish 2>&1)"; rc=$?
            printf '%s\n' "$out"
            [ "$rc" -eq 0 ] && exit 0
            printf '%s\n' "$out" | grep -qiE "already (exists|uploaded)|already been published|is already uploaded" \
              && { echo "::notice::this version is already on crates.io — treating as success"; exit 0; }
            printf '%s\n' "$out" | grep -qiE "no matching package named|failed to select a version for the requirement" \
              && { echo "kshana not yet indexed; retrying ($attempt/5)…"; sleep 15; continue; }
            exit "$rc"
          done
          req="$(sed -nE 's/^kshana = .*version = "([^"]+)".*/\1/p' Cargo.toml)"
          echo "::error::kshana-mcp publish failed — is the matching kshana version on crates.io? (check the kshana = \"${req:-?}\" requirement in mcp/kshana-mcp/Cargo.toml)"
          exit 1

  build-wheels:
    name: build wheels (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: gates
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    env:
      # Reproducible shipped wheels: a fixed timestamp strips embedded mtimes from
      # the wheel zip; codegen-units=1 (Cargo.toml [profile.release]) makes the
      # compiled extension byte-identical. Together these make the published wheel
      # match the wheels.yml rebuild-and-diff check.
      SOURCE_DATE_EPOCH: "1700000000"
    # Full platform-tag matrix (m37c34cfc): linux x86_64 + aarch64 (manylinux_2_28),
    # macOS arm64 + x86_64, Windows x64 + arm64 — the same matrix wheels.yml verifies.
    # fail-fast:false so one platform's runner hiccup never blocks the rest.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest # macos-14 runner is arm64
            target: aarch64
          # Cross-build the Intel wheel on the arm64 runner instead of a (scarce,
          # deprecating) macos-13 Intel runner that can queue indefinitely. maturin
          # adds the x86_64-apple-darwin target; the abi3 wheel cross-compiles cleanly.
          - os: macos-latest
            target: x86_64
          - os: windows-latest
            target: x64
          # Windows ARM64 builds natively on a windows-11-arm runner: maturin needs an
          # interpreter whose architecture matches the target, so the native ARM64 runner
          # (GA on GitHub-hosted public repos) ships an ARM64 Python and just works.
          - os: windows-11-arm
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --features python --out dist
          # Pin the manylinux container so every Linux wheel carries the same ABI floor
          # (GLIBC 2.28). Ignored off-Linux. The aarch64 build runs under QEMU emulation.
          manylinux: 2_28
          # Forward the deterministic-timestamp knob into the manylinux container.
          docker-options: -e SOURCE_DATE_EPOCH
      - name: Build source distribution
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Generate the CycloneDX SBOM alongside the wheel
        # Ship the SBOM beside the wheel/sdist in the same dist/ tree so it is attested
        # below and downloadable next to the release. Built once (on the linux x86_64
        # leg) from cargo metadata, which is platform-independent. Bash is the action's
        # default shell on every OS; gen-sbom.sh needs only the Rust toolchain.
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/gen-sbom.sh > dist/kshana-sbom.cdx.json
          # Assert the document before it is attested. attest-build-provenance signs
          # whatever bytes it is given, so an empty or componentless SBOM would ship as
          # a cryptographically verified bill of materials — the worst shape this
          # failure can take, because the signature makes it look checked.
          python3 - dist/kshana-sbom.cdx.json <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          assert doc.get("bomFormat") == "CycloneDX", "not a CycloneDX document"
          n = len(doc.get("components") or [])
          assert n > 0, "SBOM carries no components"
          print(f"OK: CycloneDX {doc.get('specVersion')} with {n} components")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist-${{ matrix.os }}-${{ matrix.target }}
          path: dist
          # Wheels are content-addressed by their filename; keep each platform's upload
          # distinct so the merge in `pypi-publish` is lossless.
          if-no-files-found: error

  pypi-publish:
    name: PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/kshana/
    permissions:
      contents: read
      # id-token/attestations are for the GitHub SLSA build-provenance attestation of
      # every uploaded file (actions/attest-build-provenance below) — NOT for PyPI auth,
      # which uses the PYPI_API_TOKEN secret.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Merge every platform's dist/ into one tree for a single atomic upload.
          pattern: pypi-dist-*
          path: dist
          merge-multiple: true
      - name: List artifacts to publish
        run: ls -l dist
      - name: Attest build provenance (wheels + sdist)
        uses: actions/attest-build-provenance@v1
        with:
          # The CycloneDX SBOM (kshana-sbom.cdx.json) is itself attested below; here we
          # bind every distributable Python artifact to this workflow run.
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Attest build provenance (SBOM)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/kshana-sbom.cdx.json"
      - name: Stage distributions only (move SBOM out of the upload set)
        # gh-action-pypi-publish uploads every file under packages-dir; the SBOM JSON is
        # not a distribution, so move it aside after attestation so twine sees only the
        # wheels + sdist. (It remains attested and is also a release asset via release.yml.)
        run: |
          mkdir -p sbom
          mv dist/kshana-sbom.cdx.json sbom/ 2>/dev/null || true
          ls -l dist
      - name: Gate on token
        id: gate
        env:
          TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "go=true" >> "$GITHUB_OUTPUT";
          else echo "PYPI_API_TOKEN not set; skipping PyPI publish"; fi
      - name: Publish to PyPI
        if: steps.gate.outputs.go == 'true'
        # Pinned to a commit SHA, not the mutable `release/v1` branch: this step holds a
        # live PyPI API token and an OIDC identity, and a branch (or a force-moved tag)
        # can change under us with no review. Dependabot's github-actions ecosystem keeps
        # the SHA current. Do NOT apply this to dtolnay/rust-toolchain — there the ref IS
        # the toolchain selector, and a SHA would silently install stable.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1 as of 2026-09-23)
        with:
          packages-dir: dist
          # __token__ + the project/account API token. skip-existing makes a re-run after
          # a version is already live a no-op success (same idempotency as the other jobs).
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          # PEP 740 upload attestations require OIDC Trusted Publishing; PyPI rejects them
          # under API-token auth, so they are off here. The GitHub SLSA attestation of every
          # file (attest-build-provenance above) is emitted regardless.
          attestations: false
          # twine's metadata check on each file before upload.
          verbose: true

  npm:
    name: npm
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: gates
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: npm
      url: https://www.npmjs.com/package/kshana
    permissions:
      contents: read
      # SLSA build-provenance attestation of the npm tarball. (npm-native provenance is
      # generated by `npm publish --provenance`; this attestation is the registry-neutral
      # GitHub one, verifiable with `gh attestation verify`.)
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build module
        run: wasm-pack build --target web --out-dir web/pkg --release -- --features wasm
      - name: Stage npm package README
        # wasm-pack copies the crate readme (README.crates.md); override with the
        # npm-specific surface README so the registry page renders JS/WASM usage.
        run: cp README.npm.md web/pkg/README.md
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Ship the CycloneDX SBOM inside the npm package
        # Generated into the package dir so it ships inside the published tarball, and
        # listed in package.json "files" so `npm pack`/`npm publish` includes it. Runs
        # after setup-node so the pinned Node interpreter drives the package.json patch.
        run: |
          set -euo pipefail
          ./scripts/gen-sbom.sh > web/pkg/kshana-sbom.cdx.json
          python3 - web/pkg/kshana-sbom.cdx.json <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          assert doc.get("bomFormat") == "CycloneDX", "not a CycloneDX document"
          n = len(doc.get("components") or [])
          assert n > 0, "SBOM carries no components"
          print(f"OK: CycloneDX {doc.get('specVersion')} with {n} components")
          PY
          node -e '
            const fs = require("fs");
            const p = "web/pkg/package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.files = Array.from(new Set([...(j.files || []), "kshana-sbom.cdx.json", "README.md"]));
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          '
          cat web/pkg/package.json
      - name: Pack the npm tarball (the exact bytes npm publish uploads)
        id: pack
        run: |
          tarball="$(npm pack ./web/pkg --pack-destination . --silent)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          ls -l "$tarball"
      - name: Attest build provenance (npm tarball)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}
      - name: Gate on token
        id: gate
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "go=true" >> "$GITHUB_OUTPUT";
          else echo "NPM_TOKEN not set; skipping npm publish"; fi
      - name: Publish
        if: steps.gate.outputs.go == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        # Publish the already-packed tarball so the attested bytes are exactly what ships.
        # --provenance records npm-native build provenance (id-token:write enables it).
        run: |
          set +e
          out="$(npm publish "$TARBALL" --access public --provenance 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$out" | grep -qiE "cannot publish over|previously published|EPUBLISHCONFLICT|cannot modify pre-existing version" \
              && { echo "::notice::this version is already on npm — treating as success"; exit 0; }
            exit "$rc"
          fi
