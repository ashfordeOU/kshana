# SPDX-License-Identifier: AGPL-3.0-only
# Publish Kshana to crates.io, PyPI, and npm.
#
# ORDER: tag -> verify -> publish -> parity (docs/RELEASING.md).
#
# This workflow no longer triggers on the tag push itself. release.yml calls it
# (`workflow_call`) from a job that `needs: verify`, so no registry is touched until the
# full verification of that exact tagged commit is green. That is the one mechanism
# GitHub gives for "wait for a verdict" without polling: `needs:` only works inside one
# workflow run, and a reusable workflow runs inside its caller's run. It replaces the
# arrangement this file used to admit to in its own comments, where publish.yml was a
# SEPARATE workflow on the same tag push and so raced the verification: on v0.27.2
# (tag pushed 00:04:09) crates.io finished 00:05:03, npm 00:07:14 and PyPI 00:08:35,
# while release.yml's `verify` did not return until 01:28:07 — the crate was public and
# unrecallable for 83 minutes before anything said the suite passed. On v0.27.0 npm and
# PyPI both published while the crates.io job FAILED, a half-release.
#
# The alternative considered was a gate job here that polls the Checks API for the
# verdict. It was rejected: the verdict takes 80+ minutes, so the poller would hold a
# runner for that long, and a timeout would have to be tuned against a suite whose
# runtime moves. The Actions API is still read, once, by the `gates` job below
# (scripts/check-release-verdict.sh), because it is the only thing that holds the
# manual-retry path: a `workflow_dispatch` on a tag ref has no `needs:` edge, so the
# script requires a green `verify` for that exact commit from the tag-push run of
# release.yml, and FAILS CLOSED on anything else (no run, a red or cancelled one, an
# unreadable API). On the normal path it restates what `needs:` already guarantees.
#
# Inside this workflow the publishes are ordered to make a half-release as unlikely as
# the registries allow:
#   gates -> build everything (wheels via wheels.yml, the npm tarball) -> crates.io
#         -> PyPI, npm, kshana-mcp on crates.io
# Every artifact is built and checked BEFORE the first irreversible upload, and crates.io
# goes first because its `cargo package` verification build is the step that has failed
# mid-release before (v0.27.0). After crates.io, what can still fail is a token or the
# network, not the build.
#
# A missing registry token FAILS the job. It used to skip the upload and report success,
# so a channel could silently miss a version with every job green (PyPI has no 0.22.0 or
# 0.23.0, npm no 0.22.0). release.yml's `parity` job then asks every registry whether it
# really serves the version.
#
# Every publish is idempotent: re-running after a version is already live is a no-op
# success, so a failure on one registry can be retried without touching the others —
# by "Re-run failed jobs" on the Release run (preferred; the verdict is already in that
# run), or by dispatching this workflow on the tag.
#
# Every distributed artifact (crate tarball, wheels, sdist, npm tarball) gets a
# cryptographic SLSA build-provenance attestation (actions/attest-build-provenance)
# so a consumer can verify, with `gh attestation verify`, that the exact bytes they
# downloaded were produced by this workflow from this repository. (PEP 740 upload
# attestations need OIDC Trusted Publishing and are off under token auth; the GitHub
# attestation of every uploaded file is emitted regardless.)
#
# Toolchain: every job that compiles pins dtolnay/rust-toolchain to the channel in
# rust-toolchain.toml (1.93.0) and runs scripts/check-toolchain.sh, which also fails if
# any workflow asks for another channel. wasm-pack is installed at an exact version
# (0.13.1, the version that built v0.27.2 per its publish log) with a checksum check.
name: publish

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Cheap correctness gates plus the verdict check, before anything irreversible.
  #
  # Every publishing job `needs:` this one (directly or through the build jobs), and each
  # carries `if: startsWith(github.ref, 'refs/tags/v')`, so a manual dispatch from a
  # branch is inert rather than publishing whatever is on that branch. A dispatch can
  # still select a tag ref, which is the documented retry path.
  gates:
    name: pre-publish gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      # scripts/check-release-verdict.sh reads the Release workflow's runs and jobs.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: check-no-attribution.sh scans every commit message, and the
          # default shallow checkout silently blinds that scan (same reason as ci.yml).
          fetch-depth: 0
      - name: Require a green release verdict for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-release-verdict.sh "$GITHUB_SHA"
      # Pinned to rust-toolchain.toml rather than @stable, because check-toolchain.sh
      # asserts the active rustc equals the pinned channel — a floating stable fails it.
      - uses: dtolnay/rust-toolchain@1.93.0
      - name: Toolchain pin guard
        run: ./scripts/check-toolchain.sh
      - name: Version consistency guard
        run: ./scripts/check-version-sync.sh
      - name: Repository hygiene guard
        run: ./scripts/check-no-attribution.sh

  # The one source of the shipped wheels: wheels.yml, called here. Its artifacts are what
  # the PyPI job uploads, and its auditwheel tag gate and byte-reproducibility check run
  # on those same wheels before any registry is touched.
  build-wheels:
    name: wheels
    needs: gates
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/wheels.yml

  # Build, pack and attest the npm package; the `npm` job below only uploads it.
  npm-build:
    name: npm package (build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: gates
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      # SLSA build-provenance attestation of the npm tarball. (npm-native provenance is
      # generated by `npm publish --provenance` in the `npm` job; this attestation is the
      # registry-neutral GitHub one, verifiable with `gh attestation verify`.)
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: wasm32-unknown-unknown
      - name: Toolchain pin guard
        run: ./scripts/check-toolchain.sh
      - name: Install wasm-pack (pinned)
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: wasm-pack@0.13.1
      - name: Build module
        run: wasm-pack build --target web --out-dir web/pkg --release -- --features wasm
      - name: Stage npm package README
        # wasm-pack copies the crate readme (README.crates.md); override with the
        # npm-specific surface README so the registry page renders JS/WASM usage.
        run: cp README.npm.md web/pkg/README.md
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Ship the CycloneDX SBOM inside the npm package
        # Generated into the package dir so it ships inside the published tarball, and
        # listed in package.json "files" so `npm pack`/`npm publish` includes it. Runs
        # after setup-node so the pinned Node interpreter drives the package.json patch.
        run: |
          set -euo pipefail
          ./scripts/gen-sbom.sh > web/pkg/kshana-sbom.cdx.json
          python3 - web/pkg/kshana-sbom.cdx.json <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          assert doc.get("bomFormat") == "CycloneDX", "not a CycloneDX document"
          n = len(doc.get("components") or [])
          assert n > 0, "SBOM carries no components"
          print(f"OK: CycloneDX {doc.get('specVersion')} with {n} components")
          PY
          node -e '
            const fs = require("fs");
            const p = "web/pkg/package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.files = Array.from(new Set([...(j.files || []), "kshana-sbom.cdx.json", "README.md"]));
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          '
          cat web/pkg/package.json
      - name: Pack the npm tarball (the exact bytes npm publish uploads)
        id: pack
        run: |
          set -euo pipefail
          mkdir -p npm-dist
          tarball="$(npm pack ./web/pkg --pack-destination npm-dist --silent)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          ls -l "npm-dist/$tarball"
      - name: Attest build provenance (npm tarball)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: npm-dist/${{ steps.pack.outputs.tarball }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-tarball
          path: npm-dist
          if-no-files-found: error

  crates:
    name: crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # After EVERY artifact is built and checked, and before any other registry: see the
    # ordering note at the top of this file.
    needs: [gates, build-wheels, npm-build]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: crates-io
      url: https://crates.io/crates/kshana
    permissions:
      contents: read
      # SLSA build-provenance attestation of the packaged .crate tarball.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - name: Toolchain pin guard
        run: ./scripts/check-toolchain.sh
      - name: Require the registry token
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set; a release tag cannot reach crates.io without it"
            exit 1
          fi
      - name: Package the crate (the exact tarball crates.io receives)
        # `cargo package` produces target/package/<name>-<ver>.crate — the byte-for-byte
        # tarball `cargo publish` uploads — and compiles it from ONLY the files it
        # carries, which is the check that failed v0.27.0 mid-release. Attesting it
        # (below) ties the published crate to this workflow run. --locked so the
        # SBOM/graph matches Cargo.lock.
        run: cargo package --locked
      - name: Attest build provenance (.crate)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: "target/package/*.crate"
      - name: Publish
        env:
          # cargo reads CARGO_REGISTRY_TOKEN from the environment (no deprecated --token).
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          # Reuse the already-packaged tarball (no second package step / re-verify).
          out="$(cargo publish --locked --no-verify 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$out" | grep -qiE "already (exists|uploaded)|already been published|is already uploaded" \
              && { echo "::notice::this version is already on crates.io — treating as success"; exit 0; }
            exit "$rc"
          fi

  crates-mcp:
    name: crates.io (kshana-mcp)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: crates-io-mcp
      url: https://crates.io/crates/kshana-mcp
    # The MCP server is a standalone, workspace-excluded crate that depends on the
    # published `kshana` crate (`kshana = { path = "../..", version = "<major.minor>" }`
    # in mcp/kshana-mcp/Cargo.toml, kept equal to the engine's major.minor by
    # scripts/check-version-sync.sh), so it must publish AFTER the `crates` job has
    # pushed a matching `kshana` to crates.io. The requirement is deliberately not
    # quoted here: the last time it was, the comment said 0.14 fifteen minor releases
    # after the manifest had moved on.
    needs: crates
    if: startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: mcp/kshana-mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - name: Toolchain pin guard
        working-directory: .
        run: ./scripts/check-toolchain.sh
      - name: Require the registry token
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set; a release tag cannot reach crates.io without it"
            exit 1
          fi
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          # Retry briefly: the `kshana` version this depends on may still be propagating
          # through the crates.io sparse index right after the `crates` job published it.
          for attempt in 1 2 3 4 5; do
            out="$(cargo publish 2>&1)"; rc=$?
            printf '%s\n' "$out"
            [ "$rc" -eq 0 ] && exit 0
            printf '%s\n' "$out" | grep -qiE "already (exists|uploaded)|already been published|is already uploaded" \
              && { echo "::notice::this version is already on crates.io — treating as success"; exit 0; }
            printf '%s\n' "$out" | grep -qiE "no matching package named|failed to select a version for the requirement" \
              && { echo "kshana not yet indexed; retrying ($attempt/5)…"; sleep 15; continue; }
            exit "$rc"
          done
          req="$(sed -nE 's/^kshana = .*version = "([^"]+)".*/\1/p' Cargo.toml)"
          echo "::error::kshana-mcp publish failed — is the matching kshana version on crates.io? (check the kshana = \"${req:-?}\" requirement in mcp/kshana-mcp/Cargo.toml)"
          exit 1

  pypi-publish:
    name: PyPI
    needs: [crates, build-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/kshana/
    permissions:
      contents: read
      # id-token/attestations are for the GitHub SLSA build-provenance attestation of
      # every uploaded file (actions/attest-build-provenance below) — NOT for PyPI auth,
      # which uses the PYPI_API_TOKEN secret.
      id-token: write
      attestations: write
    steps:
      - name: Require the registry token
        env:
          TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PYPI_API_TOKEN is not set; a release tag cannot reach PyPI without it"
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # Merge every platform's dist/ (built by wheels.yml) into one tree for a single
          # atomic upload.
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: List artifacts to publish
        run: ls -l dist
      - name: Attest build provenance (wheels + sdist)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          # The CycloneDX SBOM (kshana-sbom.cdx.json) is itself attested below; here we
          # bind every distributable Python artifact to this workflow run.
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Attest build provenance (SBOM)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: "dist/kshana-sbom.cdx.json"
      - name: Stage distributions only (move SBOM out of the upload set)
        # gh-action-pypi-publish uploads every file under packages-dir; the SBOM JSON is
        # not a distribution, so move it aside after attestation so twine sees only the
        # wheels + sdist. (It remains attested and is also a release asset via release.yml.)
        run: |
          mkdir -p sbom
          mv dist/kshana-sbom.cdx.json sbom/ 2>/dev/null || true
          ls -l dist
      - name: Publish to PyPI
        # Pinned to a commit SHA, not the mutable `release/v1` branch: this step holds a
        # live PyPI API token and an OIDC identity, and a branch (or a force-moved tag)
        # can change under us with no review. Dependabot's github-actions ecosystem keeps
        # the SHA current. Do NOT apply this to dtolnay/rust-toolchain — there the ref IS
        # the toolchain selector, and a SHA would silently install stable.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1 as of 2026-09-23)
        with:
          packages-dir: dist
          # __token__ + the project/account API token. skip-existing makes a re-run after
          # a version is already live a no-op success (same idempotency as the other jobs).
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          # PEP 740 upload attestations require OIDC Trusted Publishing; PyPI rejects them
          # under API-token auth, so they are off here. The GitHub SLSA attestation of every
          # file (attest-build-provenance above) is emitted regardless.
          attestations: false
          # twine's metadata check on each file before upload.
          verbose: true

  npm:
    name: npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [crates, npm-build]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: npm
      url: https://www.npmjs.com/package/kshana
    permissions:
      contents: read
      # `npm publish --provenance` signs npm-native provenance with this job's OIDC identity.
      id-token: write
    steps:
      - name: Require the registry token
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set; a release tag cannot reach npm without it"
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-tarball
          path: npm-dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Publish the tarball npm-build packed and attested, so the attested bytes are
        # exactly what ships. --provenance records npm-native build provenance.
        run: |
          set +e
          # The leading ./ is load-bearing. npm reads a bare `dir/file.tgz` as the GitHub
          # shorthand `owner/repo` and tries to clone github.com/npm-dist/...: v0.27.3's npm
          # job failed exactly that way ("Permission denied (publickey)"), after crates.io
          # and PyPI had published.
          tarball="$(ls ./npm-dist/*.tgz)"
          [ "$(printf '%s\n' "$tarball" | wc -l)" -eq 1 ] || { echo "::error::expected one tarball, found: $tarball"; exit 1; }
          out="$(npm publish "$tarball" --access public --provenance 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$out" | grep -qiE "cannot publish over|previously published|EPUBLISHCONFLICT|cannot modify pre-existing version" \
              && { echo "::notice::this version is already on npm — treating as success"; exit 0; }
            exit "$rc"
          fi
