# Telecom timing, ingestion example: a time interval error (TIE) series given inline and
# checked against the masks of the International Telecommunication Union
# Telecommunication Standardization Sector (ITU-T).
#
# Give your own record the same way: `samples` holds [time_s, time_error_ns] pairs,
# uniformly sampled. The WebAssembly build has no filesystem, so inline samples are the
# form that runs everywhere; on native builds `csv_path = "your.csv"` reads a file of
# `time_s,time_error_ns` rows instead (a header line and `#` comments are skipped).
#
# THE DATA BELOW IS NOT A MEASUREMENT. It is the first 1 200 s of the engine's own
# chip-scale atomic clock (CSAC) holdover fixture (tests/fixtures/telecom_timing/
# holdover_te_series.csv, seed 20260925), rounded to 1 ps: 300 s disciplined, then the
# Global Navigation Satellite System (GNSS) reference is lost. It is here to show the
# input shape and what the report does with it.
#
# holdover_start_s marks the loss, so the budgets and the ePRTC-A holdover envelope of
# ITU-T G.8272.1 Table 3 are timed from it. Masks written through a 0.1 Hz low-pass
# filter (the T-BC/T-TSC classes of G.8273.2 and the G.8271.1 network limits) are
# evaluated on the filtered series; the record is sampled every second, the coarsest
# interval the engine applies that filter at.
kind = "telecom-timing"
masks = ["prtc-a", "prtc-b", "eprtc", "eprtc-a-holdover", "t-bc-class-c", "g8271-1-point-c"]

[series]
holdover_start_s = 300.0
locked_duration_days = 5.0
