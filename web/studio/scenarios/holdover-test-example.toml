# Holdover test, ingestion example: a time-error record scored by the holdover-test kind
# ("pull the antenna, score the holdover"). The record is split at the two times the OPERATOR
# states, here GNSS removed at 600 s and restored at 2 400 s, and each step is measured against
# the ITU-T masks written for it.
#
# THE DATA BELOW IS NOT A MEASUREMENT. It is a record the engine's author generated for this
# example (Python random.Random(20261018), 5 s sampling): 600 s of white noise of 1.5 ns about
# zero while locked; then a holdover of a fractional frequency offset of 1.2e-10 (0.12 ns/s) and
# a drift of 5e-5 ns/s^2 with a random walk of 0.35 ns per step; then an exponential return to
# zero with a 60 s time constant. It shows the input shape and what the report does with it. It
# says nothing about any real clock, and Kshana did not remove or restore anything: the two
# times are a statement in this file.
#
# Give your own record as `samples` (time_s, time_error_ns pairs, uniformly sampled), as
# `csv_path` on native builds, or as a measured log with `[series.clock_log]` (see
# scenarios/holdover-test-ptp4l.toml and docs/CLOCK-LOG-FORMATS.md). The report says "measured
# against the mask": it is not a statement that a system conforms to anything.
kind = "holdover-test"
masks = ["prtc-a", "eprtc-a-holdover"]

[test]
gnss_removed_s = 600.0
gnss_restored_s = 2400.0
locked_duration_days = 5.0
recovery_band_ns = 100.0
recovery_dwell_s = 60.0

