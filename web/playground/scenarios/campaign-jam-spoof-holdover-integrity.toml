# ---------------------------------------------------------------- holdover
# The jammer goes to 10 dBW: every satellite is lost. The clock free-runs from its
# last synchronisation, continuing the spoofed offset (carry), and the tactical
# inertial unit coasts (the gnss-ins run is warmed up on GNSS for 100 s, skipped).
[[phases]]
name = "holdover"
duration_s = 1800.0
carry = ["time_error_ns"]

[[phases.runs]]
[phases.runs.scenario]
seed = 44
threshold_ns = 50.0
[phases.runs.scenario.time]
