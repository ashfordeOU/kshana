# ---------------------------------------------------------------- spoofing
# A time-push spoofer ramps the receiver clock at 0.1 ns/s from the start of the
# phase. The phase ends when the clock-aided monitor detects it (end_at), capped at
# 900 s. The RF detector (spoof-detect) sees a +1.5 dB, three-satellite position push
# and alarms at phase start.
[[phases]]
name = "spoofing"
duration_s = 900.0
end_at = "classical.detect_time_s"

[[phases.runs]]
[phases.runs.scenario]
kind = "spoof"
threshold_ns = 50.0
[phases.runs.scenario.time]
step_s = 10.0
duration_s = 900.0
[phases.runs.scenario.attack]
start_s = 0.0
rate_ns_per_s = 0.1
[phases.runs.scenario.clock_quantum]
id = "optical-sr-lattice"
provenance = "Strontium optical lattice clock, space-oriented goal sigma_y(1s)=1e-15 (arXiv:1503.08457); not flown."
y0 = 5.0e-17
q_wf = 1.0e-30
q_rw = 0.0
[phases.runs.scenario.clock_classical]
id = "csac-sa45s"
provenance = "Microchip SA65 / SA.45s CSAC datasheet sigma_y(1s)=3e-10; q_wf=sigma_y(1s)^2."
y0 = 5.0e-10
q_wf = 9.0e-20
q_rw = 0.0

[[phases.runs]]
[phases.runs.scenario]
kind = "spoof-detect"
[phases.runs.scenario.attack]
