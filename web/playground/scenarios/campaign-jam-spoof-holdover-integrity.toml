num_biased = 3
el_imbalance = 0.12
[phases.runs.scenario.detector]
sat_power_dbm = -130.0
agc_margin_db = 3.0
sqm_tolerance = 0.10
raim_p_fa = 1.0e-3
sigma_m = 5.0
