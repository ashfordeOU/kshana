[phases.runs.scenario.clock_classical]
id = "csac-sa45s"
provenance = "Microchip SA65 / SA.45s CSAC datasheet sigma_y(1s)=3e-10; q_wf=sigma_y(1s)^2."
y0 = 5.0e-10
q_wf = 9.0e-20
q_rw = 0.0

[[phases.runs]]
series = [
  { channel = "cn0_l1ca_dbhz", unit = "dB-Hz", t = "timeline.t_s[]", y = "timeline.bands[0].cn0_effective_dbhz[]" },
  { channel = "cn0_e1_dbhz", unit = "dB-Hz", t = "timeline.t_s[]", y = "timeline.bands[1].cn0_effective_dbhz[]" },
  { channel = "cn0_floor_dbhz", t = "timeline.t_s[]", y = "receiver.tracking_threshold_dbhz" },
  { channel = "alarm", t = "timeline.t_s[]", y = "timeline.bands[1].cn0_effective_dbhz[]", compare = "below", threshold = 25.0 },
]
[phases.runs.scenario]
kind = "spectrum"
seed = 7
duration_s = 300.0
step_s = 10.0
[phases.runs.scenario.receiver]
noise_figure_db = 2.0
antenna_temp_k = 290.0
tracking_threshold_dbhz = 25.0
[phases.runs.scenario.grid]
f_min_mhz = 1160.0
f_max_mhz = 1590.0
n_freq = 430
[[phases.runs.scenario.jammers]]
name = "CW tone on L1"
waveform = "cw"
