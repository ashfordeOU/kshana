[package]
name = "kshana"
version = "0.27.2"
edition = "2021"
description = "Open, reproducible PNT-resilience simulator with quantum-sensor performance models"
# Dual-licensed: GNU AGPL-3.0-only for open use, OR a commercial licence from
# Ashforde OÜ (contact@ashforde.org) for proprietary/closed integration. See
# LICENSE (AGPL) and LICENSING.md (the dual-licence terms and when each applies).
license = "AGPL-3.0-only"
authors = ["Chakshu Baweja <contact@ashforde.org>"]
repository = "https://github.com/ashfordeOU/kshana"
homepage = "https://kshana.dev"
documentation = "https://docs.rs/kshana"
readme = "README.crates.md"
# `cargo run -- <scenario.toml>` from a clone runs the CLI. Without this, cargo cannot tell
# the CLI from the three internal generators under src/bin/ and refuses with "could not
# determine which binary to run" — the error every `cargo run --` line in the README hit.
default-run = "kshana"
keywords = ["pnt", "navigation", "quantum", "gnss", "simulation"]
categories = ["science", "simulation"]
# Measured, not aspirational: 1.85 is the highest `rust-version` declared anywhere in
# the locked graph (hashbrown 0.17.1 and indexmap 2.14.0, both edition-2024, reached
# through the ordinary `toml` dependency), and Cargo.lock is lockfile v4, which Cargo
# below 1.78 cannot parse at all. This field read 1.75 for ten releases while the graph
# had already moved; verified by `cargo +1.85.0 build --all --locked`, clean in 56s.
rust-version = "1.85"
# Keep the published crate lean: the browser playground, CI config, and the
# fixture-backed validation tests aren't part of the library distribution. (Those
# tests read the fixtures via include_str!, so each must be excluded alongside the
# fixtures or a packaging verification build would fail to find them. The SGP4
# head-to-head also pulls the `sgp4` dev-dependency, which library consumers never
# need.)
exclude = [
    "/web",
    "/.github",
    # Surface READMEs for the other publish targets (PyPI, npm) — crates.io uses
    # README.crates.md (the `readme` field above); these would only be noise here.
    "/README.pypi.md",
    "/README.npm.md",
    "/tests/fixtures",
    # ...except the one fixture the LIBRARY itself embeds. src/lunar_orientation.rs holds
    # a top-level `include_str!` of this catalogue, so excluding it makes the published
    # crate fail to compile — which is exactly what happened to the v0.27.0 publish.
    "!/tests/fixtures/llr_geometry/de440_moon_pa.csv",
    "/tests/igs_real_data.rs",
    "/tests/sgp4_crate_comparison.rs",
    "/tests/terrain_nav_validation.rs",
    # The ANISE frame cross-validation is a standalone, workspace-excluded crate with
    # its own Cargo.lock: it depends on `anise` + `hifitime`, whose MPL-2.0 licence the
    # cargo-deny gate refuses in the published crate's dependency graph. See xval/.
    "/xval",
    # The MCP server is likewise a standalone, workspace-excluded crate: it is published
    # separately as `kshana-mcp`, depends on THIS crate, and carries its own binary and
    # Cargo.lock, so it cannot live inside this package. (It used to be excluded because
    # the edition-2024 `rmcp` SDK could not sit in an MSRV-1.75 graph; that reason died
    # when the graph itself went edition-2024 and rust-version moved to 1.85.) See mcp/.
    "/mcp",
    # The JetBrains IDE plugin is a standalone Kotlin/Gradle project, not part of the
    # Rust crate at all. See ide/jetbrains/.
    "/ide",
    # rust-toolchain.toml pins THIS repository's CI and developer compiler to an exact
    # release. Shipping it in the .crate/sdist re-exports that decision to consumers: on
    # a rustup host it silently downloads that exact compiler mid-`pip install`, while a
    # distro-rustc host ignores the file — the same command, two behaviours. The
    # floor consumers must meet is `rust-version` above, which is the field cargo reads.
    "/rust-toolchain.toml",
    # The three internal generators under src/bin/ regenerate this repository's own
    # evidence (the verification matrix and scenario reference, the paper's crossover
    # study, the release validation summary). They read and write paths in a checkout, so
    # they are useless to anyone who installed from the registry — yet while they shipped,
    # `cargo install kshana` compiled and installed all four executables. Leaving their
    # sources out of the package drops them from the published manifest (cargo lists a
    # package's binaries from the files it contains), so the registry install builds the
    # CLI alone. In a clone they are still auto-discovered: `cargo run --bin <name>` and
    # the CI and release jobs that invoke them are unchanged.
    "/src/bin/crossover_study.rs",
    "/src/bin/gen_validation_artifacts.rs",
    "/src/bin/validation_report.rs",
    # Non-library trees. Nothing the library or the CLI compiles reads from them (the
    # packaging job's `cargo package` verification build compiles exactly the packaged
    # files, so a stray include_str! into any of them fails CI, not the publish): the
    # papers and their submission packages, the paper-figure artifacts, the notebooks,
    # the long-form documentation (it is read on GitHub; every registry README links there
    # absolutely), the maintainer scripts and slash-commands, and the example programs,
    # which are evidence generators for this repository rather than library usage samples.
    "/paper",
    "/paper-artifacts",
    "/submissions",
    "/notebooks",
    "/docs",
    "/scripts",
    "/commands",
    "/examples",
]

[lib]
name = "kshana"
path = "src/lib.rs"
# rlib for the CLI and tests; cdylib for the Python / WebAssembly extension modules.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "kshana"
path = "src/main.rs"

[lints.rust]
# `cargo-tarpaulin` injects `--cfg=tarpaulin` when it builds for coverage. The tests
# read `cfg!(tarpaulin)` to run a lighter sample of the expensive scenario fuzzer under
# instrumentation (the full sample still runs in the plain `cargo test` gate). Declare
# it as a known cfg so the `unexpected_cfgs` lint (promoted to an error by the CI's
# `clippy -D warnings`) does not flag that use.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: without it serde_json parses f64 through a fast path that is not
# always correctly rounded, so a value written by a numpy oracle can come back one ULP
# from the decimal it was written as. Every JSON reference fixture in tests/fixtures is
# compared at tolerances far tighter than that, so the parse must be exact.
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
sha2 = "0.10"
hex = "0.4"

# Optional bindings. Off by default: the core library, CLI, tests, and the
# dependency-audit gate never compile or scan these unless the feature is enabled.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

# On wasm32 the (transitive) getrandom must use the browser/JS entropy source.
# Target-gated, so native builds and the dependency-audit gate are unaffected.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[features]
# Python extension module, built with maturin (`maturin build --features python`).
python = ["dep:pyo3"]
# WebAssembly module, built with wasm-pack (`wasm-pack build -- --features wasm`).
wasm = ["dep:wasm-bindgen"]

[dev-dependencies]
# Independent SGP4 implementation for the head-to-head accuracy cross-check
# (tests/sgp4_crate_comparison.rs). Test-only: never compiled into the library,
# CLI, or the published bindings; the package excludes the test that uses it.
sgp4 = "2.4"

[profile.release]
# Reproducible release builds. A single codegen unit removes the parallel-codegen
# ordering nondeterminism that otherwise makes the compiled extension differ
# byte-for-byte between two builds of the same source. Pinned here (not just via a
# CI env var) so it takes effect inside the manylinux build container too, where
# arbitrary CARGO_* environment is not forwarded — this is what makes the published
# wheel byte-reproducible and the rebuild-and-diff check (wheels.yml) green.
codegen-units = 1
