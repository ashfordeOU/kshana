# SPDX-License-Identifier: AGPL-3.0-only
# Candidate S-band RNSS signals from a published study, for kshana rnss-design.
#
# NOT an official specification of any system. The source evaluates candidate signals a
# Korean regional system might use in the S band; it states no signal specification, and no
# public KPS interface control document exists as of November 2026. Values are taken from the
# paper's Table 3 (carrier, modulation, chip rate, subcarrier frequency). The paper gives no
# code length, data/pilot split, data rate or received power for the candidates, so none is set
# here; each candidate is one component. The paper's Table 3 prints the subcarrier and chip rate
# of BOC(4,4) and BOCc(4,4) as 4.192 MHz while naming them (4,4) throughout its Tables 4 to 10;
# the (4,4) name (4.092 MHz) is used here.
format = "kshana.rnss-profile/1"

[profile]
name = "candidate-sband-sensors2022"
title = "Candidate S-band RNSS signals (Sensors 2022 study)"
status = "CANDIDATE"
citation = 'K. Han, S. Lee, M. You, J.-H. Won, "A Comprehensive Evaluation of Possible RNSS Signals in the S-Band for the KPS", Sensors 22(6):2180, 2022, doi:10.3390/s22062180, Table 3'
url = "https://doi.org/10.3390/s22062180"
licence = "CC BY 4.0 (the source article)"
disclaimer = "Not an official KPS specification; no public KPS ICD exists as of Nov 2026. Candidate signals from a published study, MODELLED."
notes = "Transmit band 16.5 MHz, the receiver front-end bandwidth of the study (Table 6) and the width of the 2483.5-2500 MHz RDSS band (Table 1). Reference signals: NavIC SPS-S and RS-S as the study gives them (its Table 2, citing ISRO-IRNSS-ICD-SPS-1.1)."

[[references]]
name = "navic-s-sps"
centre_mhz = 2492.028
modulation = "BPSK(1)"
source = "NavIC SPS-S as given in the study's Table 2 (ISRO-IRNSS-ICD-SPS-1.1)"

[[references]]
name = "navic-s-rs"
centre_mhz = 2492.028
modulation = "BOC(5,2)"
source = "NavIC RS-S as given in the study's Table 2"

