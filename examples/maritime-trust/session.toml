# Synthetic maritime demo: "can the bridge trust this fix?"
#
# A made-up NMEA 0183 log of a vessel on a Gdynia to Klaipeda route (a one-hour excerpt, about
# 15 kn, 1 Hz), generated by `cargo run --example gen_maritime_trust_demo`. From 1500 s a
# position drag-off pulls the receiver's reported position away from the vessel's real one. The
# receiver keeps reporting a VALID fix throughout (GGA quality 1, RMC status A); the score is what
# falls. The log is made up to show the format and the monitors; it is not a measurement, and the
# route is illustrative, not a chart.
#
# Run it with:   kshana receiver-trust examples/maritime-trust/session.toml
# Or live:       kshana receiver-trust live examples/maritime-trust/session.toml \
#                  --file examples/maritime-trust/gdynia-klaipeda.nmea --gate --json trust.jsonl
#
# Every threshold below is stated before the run; the values are the documented defaults
# written out, except the vessel's own limits.
kind = "receiver-trust"
name = "Synthetic Baltic passage with a position drag-off"

[log]
format = "nmea"
path = "gdynia-klaipeda.nmea"

[monitors]
calibration_s = 300.0   # the first five minutes form the baseline and are never scored
cn0_drop_db = 6.0
cn0_min_sats = 4
sats_lost = 4

# The vessel, stated up front.
[platform]
kind = "vessel"
max_speed_kn = 20.0         # the vessel makes about 15 kn
max_accel_mps2 = 0.2
max_turn_rate_dps = 2.0
antenna_height_m = 18.0     # antenna above the waterline
heading_sensor = true       # the stream carries a gyro heading (HDT)

[maritime]
kin_window_s = 30.0
kin_pos_tol_m = 12.0
kin_sog_frac = 0.02
kin_limit_guard = 0.8
min_speed_kn = 3.0
hdg_cog_tol_deg = 10.0
stw_sog_tol_kn = 2.0
sea_level_tol_m = 15.0
smooth_s = 10.0
cn0_spread_frac = 0.5
cn0_spread_min_sats = 6
cn0_spread_min_base_db = 2.0
cn0_rise_db = 3.0
cn0_rise_sat_db = 2.0
cn0_rise_frac = 0.8
time_step_tol_s = 1.5
time_offset_tol_s = 1.0

# The trust score: 100 minus the weighted deductions; the bands map onto the trust states.
[score]
nominal_min = 90.0
degraded_min = 55.0
onset_ratio = 0.5
full_ratio = 1.5
evidence_hold_s = 10.0

[score.weights]
osnma = 70.0
kinematic = 60.0
raim = 60.0
clock = 60.0
position-jump = 60.0
heading-course = 40.0
speed-log = 40.0
time-consistency = 40.0
solve-failure = 40.0
sea-level = 30.0
cn0-spread = 30.0
cn0-rise = 30.0
cn0-drop = 30.0
loss-of-lock = 25.0
agc = 25.0
jam-ind = 25.0

# Live mode (kshana receiver-trust live): when a cycle of sentences is complete, and how long
# the gate holds a withheld fix after the epochs leave the untrusted band.
[live]
idle_flush_s = 0.35
gate_release_s = 30.0
