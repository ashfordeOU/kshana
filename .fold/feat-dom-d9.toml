outcome = "PROMOTE"
status = "Validated"
basis = "Library"
oracle_test = "tests/clock_library_lag1_noise_id_allantools.rs"

[[rows]]
id = "NEW (b) device cards"
requirement = "Measured clock device cards (held-out prediction)"
