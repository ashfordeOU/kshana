# Tests the integrator runs for this package.
[tests]
filter = "clock_library"
lib_filters = ["clock_library", "realdata::clk", "utck_bound", "allan::tests::lag1"]
integration = [
  "clock_library_lag1_noise_id_allantools",
  "clock_library_device_cards_oracle",
  "clock_library_tcxo_card_jammertest_oracle",
  "clock_library_periodic_cards_oracle",
  "clock_library_f9p_cards_oracle",
  "clock_state_ext_igs_conditioned_oracle",
  "utck_bound_prospective_oracle",
]
data_gated = "the ZED-F9P tests and M010 rounds 4/4b read $KSHANA_ORACLES/data/wroclaw_f9p (generate.py); non_blind_cards_are_reported reads realdata-cache/cs5071a and realdata-cache/ocxo (scripts/fetch_cs5071a.sh, scripts/fetch_ocxo.sh); KSHANA_REQUIRE_REALDATA=1 makes their absence fail"
