apiVersion: v1
kind: Service
metadata:
  name: {{ include "kshana.fullname" . }}
  labels:
    {{- include "kshana.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kshana.selector" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
