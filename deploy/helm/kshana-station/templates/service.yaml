apiVersion: v1
kind: Service
metadata:
  name: {{ include "kshana-station.fullname" . }}
  labels:
    {{- include "kshana-station.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kshana-station.selector" . | nindent 4 }}
  ports:
    - name: status
      port: {{ .Values.http.port }}
      targetPort: status
