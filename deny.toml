[advisories]
version = 2
# Fail (not just warn) if a dependency resolves to a yanked release, so a yanked
# crate cannot silently enter the build.
yanked = "deny"

[licenses]
version = 2
# Dependencies must stay PERMISSIVE. Kshana itself is AGPL-3.0-only and is
# dual-licensed commercially (see LICENSE / LICENSING.md), which is only possible
# while every dependency we redistribute is relicensable under our commercial
# terms — i.e. permissive. A copyleft (GPL/AGPL/LGPL/MPL) dependency would taint
# the commercial edition, so they stay off this list on purpose.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception", # target-lexicon (pyo3 build dependency)
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
]
# AGPL is allowed ONLY for crates we publish ourselves, never for the dependency tree.
# This lets the license gate accept our own AGPL-3.0-only license without opening the
# door to copyleft dependencies (which would break commercial dual-licensing).
exceptions = [
  { name = "kshana", allow = ["AGPL-3.0-only"] },
  # kshana-mcp (mcp/kshana-mcp) is a separate package with its own Cargo.lock, excluded
  # from the root one, carrying the identical AGPL-3.0-only + commercial dual licence.
  # This entry matters only when cargo-deny runs from that directory, where kshana-mcp is
  # the ROOT of the inspected graph: measured there, it was the single licence rejection
  # in the whole tree, so the carve-out opens nothing beyond our own crate.
  { name = "kshana-mcp", allow = ["AGPL-3.0-only"] },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
