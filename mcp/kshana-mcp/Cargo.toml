# Standalone, workspace-EXCLUDED MCP server crate.
#
# Why a separate crate and not a `kshana` cargo feature: it keeps the MCP SDK (`rmcp`)
# and its async runtime out of the published `kshana` crate's dependency graph, so a
# library or Python user never compiles a server they do not run. It was originally
# forced by the MSRV: rmcp is edition 2024 (rustc >= 1.85), and the root crate then
# promised 1.75. That reason is gone — the root's `rust-version` is now 1.85 — and the
# isolation stays for the graph-size reason alone (and lets this crate's own floor sit
# at 1.88, see `rust-version` below, without moving the library's).
#
# It is NOT outside CI: the root package declares no `[workspace]` and lists `/mcp` in
# its `exclude`, so root `cargo` never sees this crate, and ci.yml therefore gates it
# explicitly — `mcp-check` runs its tests and `mcp-deny` runs cargo-deny (advisories,
# licences, bans, sources) against this crate's own Cargo.lock. Dependabot watches that
# lockfile and this crate's Dockerfile through their own entries.
[package]
name = "kshana-mcp"
version = "0.27.2"
edition = "2024"
# 1.88, three minors above the `kshana` library's 1.85. Three advisories against rmcp
# < 2.1 (a Streamable-HTTP session-table leak, missing OAuth resource validation, and
# custom headers leaking across a cross-origin redirect) are fixed only in rmcp 2.x,
# whose macros pull in darling 0.23, which needs 1.88. This server uses the stdio
# transport alone, so none of the three was reachable here, but the floor moves anyway
# rather than pin a vulnerable SDK. Only this binary's install floor moves.
rust-version = "1.88"
description = "Model Context Protocol (MCP) server exposing the Kshana PNT-resilience simulator to AI agents, MCP-compatible assistants, and JetBrains AI."
# Dual-licensed: AGPL-3.0-only, or a commercial licence from Ashforde OÜ
# (contact@ashforde.org). See ../../LICENSE and ../../LICENSING.md.
license = "AGPL-3.0-only"
repository = "https://github.com/AshfordeOU/kshana"
homepage = "https://kshana.dev"
keywords = ["mcp", "pnt", "gnss", "navigation", "ai"]
categories = ["science", "command-line-utilities"]
readme = "README.md"

[[bin]]
name = "kshana-mcp"
path = "src/main.rs"

[dependencies]
# Path for local development; the version requirement is what `cargo publish` records,
# resolving to the published `kshana` crate on crates.io (so `cargo install kshana-mcp`
# works without this repo checked out).
kshana = { path = "../..", version = "0.27" }
rmcp = { version = "2.1", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
schemars = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# The MCP client side, for the in-process (duplex) round-trip integration test.
rmcp = { version = "2.1", features = ["client"] }
