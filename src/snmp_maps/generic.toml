[[object]]
name = "ntpEntStatusCurrentMode"
oid = "1.3.6.1.2.1.197.1.2.1.0"
labels = { "1" = "notRunning", "2" = "notSynchronized", "3" = "noneConfigured", "4" = "syncToLocal", "5" = "syncToRefclock", "6" = "syncToRemoteServer", "99" = "unknown" }

