# kshana.snmp-map/1: the generic map for a grandmaster or time server, from IETF MIBs only.
# SNMPv2-MIB system group (RFC 3418), NTPv4-MIB (RFC 5907, mib-2 197) and PTPBASE-MIB
# (RFC 8173, mib-2 241). An agent that implements none of the PTP or NTP MIBs still answers the
# system group; what it lacks is listed under `missing`.
schema = "kshana.snmp-map/1"
name = "generic"
sources = [
  "RFC 3418 SNMPv2-MIB system group (1.3.6.1.2.1.1)",
  "RFC 5907 NTPv4-MIB ntpEntInfo and ntpEntStatus (1.3.6.1.2.1.197.1.1 and .1.2)",
  "RFC 8173 PTPBASE-MIB clock data sets (1.3.6.1.2.1.241.1.2), indexed by domain, clock type and instance",
]

[[object]]
name = "sysDescr"
oid = "1.3.6.1.2.1.1.1.0"

[[object]]
name = "sysUpTime"
oid = "1.3.6.1.2.1.1.3.0"

[[object]]
name = "sysName"
